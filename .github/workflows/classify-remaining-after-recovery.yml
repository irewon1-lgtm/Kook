name: KR4 Classify Remaining After Recovery

on:
  push:
    branches:
      - fix/incomplete-267-recovery-v1
    paths:
      - scripts/classify_remaining_after_recovery.py
      - .github/workflows/classify-remaining-after-recovery.yml

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incomplete-267-recovery-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify current remaining set
        run: python scripts/classify_remaining_after_recovery.py
      - name: Verify current recovered baseline
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/remaining_after_recovery.json',encoding='utf-8'))
          assert p['universe_count']==2649
          assert p['complete_count']==2391
          assert p['incomplete_count']==258
          assert p['available_counts']=={'M01':2508,'M02':2417,'M03':2639,'M04':2611}
          print('KR4_POST_RECOVERY_CLASSIFICATION_GATE=PASS')
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/remaining_after_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record KR4 remaining incomplete set after recovery'
          git pull --rebase origin fix/incomplete-267-recovery-v1
          git push origin HEAD:fix/incomplete-267-recovery-v1
