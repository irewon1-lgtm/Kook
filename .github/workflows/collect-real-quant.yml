name: Collect Real KR4 Quant Snapshot

on:
  schedule:
    # Two independent post-close chances on Korean weekdays: 17:40 and 21:30 KST.
    - cron: "40 8 * * 1-5"
    - cron: "30 12 * * 1-5"
  push:
    branches:
      - "main"
      - "fix/auto-update-v2"
    paths:
      - "scripts/collect_real_quant.py"
      - "scripts/collect_real_quant_v2.py"
      - "scripts/collect_real_quant_v3.py"
      - "tests/test_auto_update_pipeline.py"
      - ".github/workflows/collect-real-quant.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr4-real-quant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependency
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests

      - name: Adversarial auto-update logic tests
        run: |
          set -euo pipefail
          python tests/test_auto_update_pipeline.py

      - name: Preserve previous known-good baseline
        run: |
          set -euo pipefail
          cp evidence/real_quant_snapshot.json /tmp/kr4_baseline.json

      - name: Collect into staging only
        run: |
          set -euo pipefail
          python scripts/collect_real_quant_v3.py \
            --as-of auto \
            --price-cutoff auto \
            --workers 14 \
            --kotlin-out /tmp/GeneratedRealQuantSnapshot.kt \
            --evidence-out /tmp/real_quant_snapshot.json

      - name: Extreme fail-closed quality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, pathlib, re
          from datetime import date

          new=json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))
          old=json.load(open('/tmp/kr4_baseline.json',encoding='utf-8'))
          n=new['universe_count']
          assert n==old['universe_count']==len(new['records']), (n,old['universe_count'],len(new['records']))
          assert new.get('auto_update',{}).get('collector')=='collect_real_quant_v3.py'
          assert new.get('auto_update',{}).get('dart_period') in {'Q1','HY','Q3','FY'}
          snap=date.fromisoformat(new['snapshot_date_kst'])
          price=date.fromisoformat(new['price_cutoff_date_kst'])
          assert price<=snap and (snap-price).days<=10,(snap,price)
          c=new['coverage']; b=old['coverage']
          floors={
            'm01_available':max(int(n*0.88),int(b['m01_available'])-55),
            'm02_available':max(int(n*0.84),int(b['m02_available'])-55),
            'm03_available':max(int(n*0.58),int(b['m03_available'])-80),
            'm04_available':max(int(n*0.96),int(b['m04_available'])-30),
            'complete_count':max(int(n*0.50),int(b['complete_count'])-100),
          }
          for k,floor in floors.items():
            assert int(c[k])>=floor,(k,c[k],floor,b[k])
          assert c['ranked_count']==c['complete_count']
          ranks=[]; per_explained=0; source_errors=0
          for code,r in new['records'].items():
            assert re.fullmatch(r'[0-9A-Z]{6}',code),code
            assert r['name'] and r['market'] in {'KOSPI','KOSDAQ'}
            ms=[r[f'm0{i}'] for i in range(1,5)]
            for m in ms:
              raw,pct,reason,basis=m['raw'],m['percentile'],m['reason'],m['basis']
              if raw is None:
                assert pct is None and reason,(code,m)
              else:
                assert math.isfinite(float(raw)) and pct is not None and 0<=float(pct)<=100 and basis,(code,m)
              if reason in {'NAVER_INTEGRATION_ERROR','NAVER_WORKER_EXCEPTION'}:
                source_errors+=1
            if ms[2]['raw'] is not None or ms[2]['reason']=='NONPOSITIVE_EPS': per_explained+=1
            complete=all(m['raw'] is not None for m in ms)
            assert (r['composite'] is not None)==complete,(code,'composite')
            assert (r['rank'] is not None)==complete,(code,'rank')
            if r['rank'] is not None: ranks.append(int(r['rank']))
          assert sorted(ranks)==list(range(1,len(ranks)+1))
          assert per_explained>=int(n*0.985),(per_explained,n)
          assert source_errors<=15,source_errors
          assert new['records']['005930']['name']=='삼성전자'
          kt=pathlib.Path('/tmp/GeneratedRealQuantSnapshot.kt').read_text(encoding='utf-8')
          assert 'fun installRuntimeSnapshot(' in kt
          assert 'runtimeRows' in kt
          assert f'const val universeCount: Int = {n}' in kt
          print('AUTO_UPDATE_EXTREME_GATE_PASS',json.dumps({'coverage':c,'floors':floors,'per_explained':per_explained,'source_errors':source_errors,'snapshot':str(snap),'price':str(price)},ensure_ascii=False))
          PY

      - name: Rebase before promotion and recheck identity set
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          import collect_real_quant as base
          staged=set(json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))['records'])
          current={x.code for x in base.load_issuers()}
          assert staged==current,('master changed during collection',len(staged),len(current),sorted(staged^current)[:20])
          print('POST_REBASE_IDENTITY_GATE_PASS',len(current))
          PY

      - name: Promote staged snapshot atomically in workspace
        run: |
          set -euo pipefail
          cp /tmp/GeneratedRealQuantSnapshot.kt app/src/main/java/com/krstock/v3/data/generated/GeneratedRealQuantSnapshot.kt
          cp /tmp/real_quant_snapshot.json evidence/real_quant_snapshot.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and regression-check promoted snapshot
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit only after every gate passes
        run: |
          set -euo pipefail
          git add app/src/main/java/com/krstock/v3/data/generated/GeneratedRealQuantSnapshot.kt evidence/real_quant_snapshot.json
          if git diff --cached --quiet; then
            echo "No real quant snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COV=$(python - <<'PY'
          import json
          d=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          c=d['coverage']
          print(f"{d['snapshot_date_kst']} price={d['price_cutoff_date_kst']} M01={c['m01_available']} M02={c['m02_available']} M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']}")
          PY
          )
          git commit -m "Auto-refresh KR4 validated snapshot: ${COV}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload proof whether changed or unchanged
        uses: actions/upload-artifact@v4
        with:
          name: KR4_AutoUpdate_Collection_Proof
          path: |
            evidence/real_quant_snapshot.json
            app/src/main/java/com/krstock/v3/data/generated/GeneratedRealQuantSnapshot.kt
          if-no-files-found: error
          retention-days: 14
