name: Collect Real KR4 Quant Snapshot

on:
  schedule:
    # Two independent post-close chances on Korean weekdays: 17:40 and 21:30 KST.
    - cron: "40 8 * * 1-5"
    - cron: "30 12 * * 1-5"
  push:
    branches:
      - "main"
      - "fix/auto-update-v2"
    paths:
      - "scripts/collect_real_quant.py"
      - "scripts/collect_real_quant_v2.py"
      - "scripts/collect_real_quant_v3.py"
      - "scripts/collect_quarterly_history.py"
      - "scripts/collect_quarterly_history_parallel.py"
      - "scripts/apply_recent_dart_fallback.py"
      - "scripts/apply_fiscal_calendar_recovery.py"
      - "scripts/apply_standard_actual_recovery.py"
      - "tests/test_auto_update_pipeline.py"
      - "tests/test_quarterly_history.py"
      - ".github/workflows/collect-real-quant.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr4-real-quant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector and recovery dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pandas lxml

      - name: Adversarial auto-update logic tests
        run: |
          set -euo pipefail
          python tests/test_auto_update_pipeline.py
          python tests/test_quarterly_history.py
          python scripts/apply_recent_dart_fallback.py --self-test
          python scripts/apply_fiscal_calendar_recovery.py --self-test
          python scripts/apply_standard_actual_recovery.py --self-test

      - name: Preserve previous known-good baseline
        run: |
          set -euo pipefail
          cp evidence/real_quant_snapshot.json /tmp/kr4_baseline.json

      - name: Collect four-metric snapshot into staging only
        run: |
          set -euo pipefail
          python scripts/collect_real_quant_v3.py \
            --as-of auto \
            --price-cutoff auto \
            --workers 14 \
            --kotlin-out /tmp/GeneratedRealQuantSnapshot.kt \
            --evidence-out /tmp/real_quant_snapshot.json

      - name: Collect 8-quarter operating history into staging only
        run: |
          set -euo pipefail
          AS_OF=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))['snapshot_date_kst'])
          PY
          )
          python scripts/collect_quarterly_history_parallel.py \
            --as-of "$AS_OF" \
            --visible-quarters 8 \
            --support-quarters 12 \
            --period-workers 3 \
            --out /tmp/quarterly_history.json

      - name: Apply durable fail-closed recovery chain to staging
        run: |
          set -euo pipefail
          python scripts/apply_recent_dart_fallback.py \
            --quant /tmp/real_quant_snapshot.json \
            --history /tmp/quarterly_history.json \
            --out /tmp/real_quant_snapshot.json
          python scripts/apply_fiscal_calendar_recovery.py \
            --quant /tmp/real_quant_snapshot.json \
            --out /tmp/real_quant_snapshot.json \
            --kind-retries 3
          python scripts/apply_standard_actual_recovery.py \
            --quant /tmp/real_quant_snapshot.json \
            --out /tmp/real_quant_snapshot.json

      - name: Recovery-chain integrity gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))
          assert 'recent_dart_fallback' in d
          assert 'fiscal_calendar_recovery' in d
          assert 'standard_actual_recovery' in d
          assert not d['fiscal_calendar_recovery'].get('source_errors'), d['fiscal_calendar_recovery'].get('source_errors')
          assert d['standard_actual_recovery'].get('source_error_count')==0
          for mid in ('m01','m02','m03','m04'):
            counted={}
            for row in d['records'].values():
              m=row[mid]
              key='AVAILABLE' if m['raw'] is not None else (m['reason'] or 'UNKNOWN')
              counted[key]=counted.get(key,0)+1
            assert d['reason_counts'][mid]==counted,(mid,d['reason_counts'][mid],counted)
          print('RECOVERY_CHAIN_INTEGRITY_GATE_PASS', json.dumps({
            'recent': {k:d['recent_dart_fallback'].get(k) for k in ('m01_recovered','m02_recovered')},
            'fiscal': {k:d['fiscal_calendar_recovery'].get(k) for k in ('m01_recovered','m02_recovered')},
            'standard': {k:d['standard_actual_recovery'].get(k) for k in ('m01_recovered','m02_recovered','promoted_complete_count')},
            'coverage': d['coverage'],
          },ensure_ascii=False))
          PY

      - name: Extreme fail-closed four-metric quality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, pathlib, re
          from datetime import date
          new=json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))
          old=json.load(open('/tmp/kr4_baseline.json',encoding='utf-8'))
          n=new['universe_count']
          assert n==old['universe_count']==len(new['records']), (n,old['universe_count'],len(new['records']))
          assert new.get('auto_update',{}).get('collector')=='collect_real_quant_v3.py'
          assert new.get('auto_update',{}).get('dart_period') in {'Q1','HY','Q3','FY'}
          snap=date.fromisoformat(new['snapshot_date_kst'])
          price=date.fromisoformat(new['price_cutoff_date_kst'])
          assert price<=snap and (snap-price).days<=10,(snap,price)
          c=new['coverage']; b=old['coverage']
          floors={
            'm01_available':max(int(n*0.88),int(b['m01_available'])-55),
            'm02_available':max(int(n*0.84),int(b['m02_available'])-55),
            'm03_available':max(int(n*0.58),int(b['m03_available'])-80),
            'm04_available':max(int(n*0.96),int(b['m04_available'])-30),
            'complete_count':max(int(n*0.50),int(b['complete_count'])-100),
          }
          for k,floor in floors.items(): assert int(c[k])>=floor,(k,c[k],floor,b[k])
          assert c['ranked_count']==c['complete_count']
          ranks=[]; per_explained=0; source_errors=0
          for code,r in new['records'].items():
            assert re.fullmatch(r'[0-9A-Z]{6}',code),code
            assert r['name'] and r['market'] in {'KOSPI','KOSDAQ'}
            ms=[r[f'm0{i}'] for i in range(1,5)]
            for m in ms:
              raw,pct,reason,basis=m['raw'],m['percentile'],m['reason'],m['basis']
              if raw is None: assert pct is None and reason,(code,m)
              else: assert math.isfinite(float(raw)) and pct is not None and 0<=float(pct)<=100 and basis,(code,m)
              if reason in {'NAVER_INTEGRATION_ERROR','NAVER_WORKER_EXCEPTION'}: source_errors+=1
            if ms[2]['raw'] is not None or ms[2]['reason']=='NONPOSITIVE_EPS': per_explained+=1
            complete=all(m['raw'] is not None for m in ms)
            assert (r['composite'] is not None)==complete,(code,'composite')
            assert (r['rank'] is not None)==complete,(code,'rank')
            if r['rank'] is not None: ranks.append(int(r['rank']))
          assert sorted(ranks)==list(range(1,len(ranks)+1))
          assert per_explained>=int(n*0.985),(per_explained,n)
          assert source_errors<=15,source_errors
          assert new['records']['005930']['name']=='삼성전자'
          kt=pathlib.Path('/tmp/GeneratedRealQuantSnapshot.kt').read_text(encoding='utf-8')
          assert 'fun installRuntimeSnapshot(' in kt and 'runtimeRows' in kt
          assert f'const val universeCount: Int = {n}' in kt
          print('AUTO_UPDATE_EXTREME_GATE_PASS',json.dumps({'coverage':c,'floors':floors,'per_explained':per_explained,'source_errors':source_errors,'snapshot':str(snap),'price':str(price)},ensure_ascii=False))
          PY

      - name: Extreme fail-closed 8-quarter history quality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/quarterly_history.json',encoding='utf-8'))
          q=json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))
          n=q['universe_count']
          assert d['schema_version']==1
          assert len(d['records'])==n==2649,(len(d['records']),n)
          periods=d['target_periods']
          assert len(periods)==8 and len(set(periods))==8,periods
          assert periods==sorted(periods,key=lambda s:(int(s[:4]),int(s[-1]))),periods
          c=d['coverage']
          floors={
            'stocks_with_1q':int(n*0.78),
            'stocks_with_4q':int(n*0.62),
            'stocks_with_8q':int(n*0.45),
            'stocks_with_4q_margin':int(n*0.52),
            'stocks_with_8q_margin':int(n*0.36),
          }
          for key,floor in floors.items(): assert int(c[key])>=floor,(key,c[key],floor)
          for code,r in d['records'].items():
            assert len(r['points'])==8,(code,len(r['points']))
            for p in r['points']:
              assert p['period'] in periods,(code,p['period'])
              assert p['scope'] in {'','CFS','OFS'},(code,p['scope'])
              for key in ('revenue','operating_income','operating_margin','revenue_yoy','revenue_qoq'):
                v=p[key]
                assert v is None or math.isfinite(float(v)),(code,p['period'],key,v)
              if p['revenue'] is None: assert p['reason'],(code,p)
              if p['basis']=='FY_MINUS_Q3': assert p['quarter']==4,(code,p)
          for code in ('005930','000660','000250'):
            assert sum(p['revenue'] is not None for p in d['records'][code]['points'])>=4,(code,d['records'][code]['points'])
          print('QUARTERLY_HISTORY_EXTREME_GATE_PASS',json.dumps({'periods':periods,'coverage':c,'floors':floors},ensure_ascii=False))
          PY

      - name: Rebase before promotion and recheck identity set
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          import collect_real_quant as base
          staged=set(json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))['records'])
          history=set(json.load(open('/tmp/quarterly_history.json',encoding='utf-8'))['records'])
          current={x.code for x in base.load_issuers()}
          assert staged==current,('master changed during collection',len(staged),len(current),sorted(staged^current)[:20])
          assert history==current,('history identity mismatch',len(history),len(current),sorted(history^current)[:20])
          print('POST_REBASE_IDENTITY_GATE_PASS',len(current))
          PY

      - name: Promote validated remote snapshots only
        run: |
          set -euo pipefail
          # Runtime data refreshes are remote JSON updates, not APK releases.
          # Bundled Kotlin/asset fallbacks are updated only on deliberate app releases.
          cp /tmp/real_quant_snapshot.json evidence/real_quant_snapshot.json
          cp /tmp/quarterly_history.json evidence/quarterly_history.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and regression-check app against validated remote schema
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit remote data only after every gate passes
        run: |
          set -euo pipefail
          git add evidence/real_quant_snapshot.json evidence/quarterly_history.json
          if git diff --cached --quiet; then
            echo "No quant/history remote snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COV=$(python - <<'PY'
          import json
          d=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8')); c=d['coverage']
          h=json.load(open('evidence/quarterly_history.json',encoding='utf-8')); hc=h['coverage']
          print(f"{d['snapshot_date_kst']} price={d['price_cutoff_date_kst']} M01={c['m01_available']} M02={c['m02_available']} M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']} history4q={hc['stocks_with_4q']} history8q={hc['stocks_with_8q']}")
          PY
          )
          git commit -m "Auto-refresh KR4 remote quant + 8Q history: ${COV}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload proof whether changed or unchanged
        uses: actions/upload-artifact@v4
        with:
          name: KR4_AutoUpdate_Collection_Proof
          path: |
            evidence/real_quant_snapshot.json
            evidence/quarterly_history.json
          if-no-files-found: error
          retention-days: 14
