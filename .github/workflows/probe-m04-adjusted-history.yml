name: KR4 Probe M04 Adjusted History

on:
  push:
    branches:
      - fix/incomplete-recovery-v4-main-sync
    paths:
      - scripts/probe_m04_adjusted_history.py
      - .github/workflows/probe-m04-adjusted-history.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incomplete-recovery-v4-main-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pykrx
        run: pip install -q pykrx
      - name: Probe adjusted and unadjusted history
        run: python scripts/probe_m04_adjusted_history.py
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/m04_adjusted_history_probe.json
          git commit -m 'Record adjusted-history M04 probe'
          git pull --rebase origin fix/incomplete-recovery-v4-main-sync
          git push origin HEAD:fix/incomplete-recovery-v4-main-sync
