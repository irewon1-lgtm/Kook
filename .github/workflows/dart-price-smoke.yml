name: DART and Price Source Smoke

on:
  push:
    branches: ["connect-dart-price-data"]
    paths: [".github/workflows/dart-price-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Naver endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          for u in [
            'https://m.stock.naver.com/api/stock/005930/basic',
            'https://m.stock.naver.com/api/stock/000250/basic',
            'https://m.stock.naver.com/api/stock/005930/integration',
            'https://api.stock.naver.com/chart/domestic/item/005930?periodType=dayCandle&startDateTime=20260301&endDateTime=20260915']:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 KR4/1.0','Referer':'https://m.stock.naver.com/'})
              with urllib.request.urlopen(req, timeout=20) as r: body=r.read()
              assert body
              print('NAVER_OK',u.split('?')[0],len(body))
          PY
      - name: Download official OpenDART bulk PL with session and inspect schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,re,zipfile,requests
          base='https://opendart.fss.or.kr'
          hdr={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Referer':base+'/disclosureinfo/fnltt/dwld/main.do'}
          s=requests.Session()
          r=s.get(base,headers=hdr,timeout=30); r.raise_for_status()
          r=s.post(base+'/disclosureinfo/fnltt/dwld/list.do',headers=hdr,timeout=60); r.raise_for_status()
          html=r.text
          m=re.search(r"download_ext002\('2026','HY',\s*'PL',\s*'([^']+)'\)",html); assert m
          fn=m.group(1); print('DART_FILE',fn)
          r=s.get(base+'/cmm/downloadFnlttZip.do',params={'fl_nm':fn},headers=hdr,timeout=300)
          print('DOWNLOAD_STATUS',r.status_code,'ctype',r.headers.get('content-type'),'bytes',len(r.content))
          assert r.status_code==200 and r.content[:2]==b'PK', r.text[:500]
          z=zipfile.ZipFile(io.BytesIO(r.content)); names=z.namelist(); print('DART_ZIP_OK entries',len(names),names[:5])
          for target in names[:3]:
              data=z.read(target); print('TXT_FILE',target,'bytes',len(data))
              text=None
              for enc in ('utf-8-sig','cp949','euc-kr','utf-8'):
                  try: text=data.decode(enc); print('ENCODING',enc); break
                  except UnicodeDecodeError: pass
              assert text
              lines=text.splitlines(); print('HEADER',lines[0][:4000])
              for line in lines[1:3]: print('SAMPLE',line[:4000])
          PY
