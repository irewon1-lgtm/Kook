name: DART and Price Source Smoke

on:
  push:
    branches: ["connect-dart-price-data"]
    paths: [".github/workflows/dart-price-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Naver integration and price response shapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 KR4/1.0','Referer':'https://m.stock.naver.com/','Accept':'application/json, text/plain, */*'})
          for code in ['005930','000250']:
              r=s.get(f'https://m.stock.naver.com/api/stock/{code}/integration',timeout=20); print('INT_STATUS',code,r.status_code); r.raise_for_status(); d=r.json()
              print('TOTAL_INFOS',code,json.dumps((d.get('totalInfos') or [])[:30],ensure_ascii=False))
              r=s.get(f'https://m.stock.naver.com/api/stock/{code}/price?pageSize=200&page=1',timeout=20); print('PRICE_STATUS',code,r.status_code); r.raise_for_status(); p=r.json()
              print('PRICE_TYPE',code,type(p).__name__)
              if isinstance(p,list): print('PRICE_LIST',code,'len',len(p),'first',p[0] if p else None,'last',p[-1] if p else None)
              elif isinstance(p,dict):
                  print('PRICE_KEYS',code,sorted(p.keys()))
                  for k,v in p.items():
                      if isinstance(v,list): print('PRICE_NESTED_LIST',code,k,'len',len(v),'first',v[0] if v else None,'last',v[-1] if v else None)
          PY
      - name: Verify official OpenDART public bulk PL is downloadable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,re,zipfile,requests
          base='https://opendart.fss.or.kr'; hdr={'User-Agent':'Mozilla/5.0 KR4/1.0','Referer':base+'/disclosureinfo/fnltt/dwld/main.do'}
          s=requests.Session(); s.get(base,headers=hdr,timeout=30).raise_for_status()
          html=s.post(base+'/disclosureinfo/fnltt/dwld/list.do',headers=hdr,timeout=60).text
          m=re.search(r"download_ext002\('2026','HY',\s*'PL',\s*'([^']+)'\)",html); assert m
          fn=m.group(1); r=s.get(base+'/cmm/downloadFnlttZip.do',params={'fl_nm':fn},headers=hdr,timeout=300)
          assert r.status_code==200 and r.content[:2]==b'PK'
          print('DART_BULK_OK',fn,len(r.content),len(zipfile.ZipFile(io.BytesIO(r.content)).namelist()))
          PY
