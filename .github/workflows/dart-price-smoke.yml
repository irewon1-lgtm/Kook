name: DART and Price Source Smoke

on:
  push:
    branches: ["connect-dart-price-data"]
    paths: [".github/workflows/dart-price-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Naver endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          for u in [
            'https://m.stock.naver.com/api/stock/005930/basic',
            'https://m.stock.naver.com/api/stock/000250/basic',
            'https://m.stock.naver.com/api/stock/005930/integration',
            'https://api.stock.naver.com/chart/domestic/item/005930?periodType=dayCandle&startDateTime=20260301&endDateTime=20260915']:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 KR4/1.0','Referer':'https://m.stock.naver.com/'})
              with urllib.request.urlopen(req, timeout=20) as r: body=r.read()
              assert body
              print('NAVER_OK',u.split('?')[0],len(body))
          PY
      - name: Download official OpenDART 2026 half-year PL and inspect schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, re, urllib.request, urllib.parse, zipfile
          base='https://opendart.fss.or.kr'
          hdr={'User-Agent':'Mozilla/5.0 KR4/1.0','Referer':base+'/disclosureinfo/fnltt/dwld/main.do'}
          req=urllib.request.Request(base+'/disclosureinfo/fnltt/dwld/list.do',headers=hdr)
          with urllib.request.urlopen(req,timeout=30) as r: html=r.read().decode('utf-8','replace')
          m=re.search(r"download_ext002\('2026','HY',\s*'PL',\s*'([^']+)'\)",html)
          assert m
          fn=m.group(1); print('DART_FILE',fn)
          u=base+'/cmm/downloadFnlttZip.do?'+urllib.parse.urlencode({'fl_nm':fn})
          req=urllib.request.Request(u,headers=hdr)
          with urllib.request.urlopen(req,timeout=180) as r: raw=r.read()
          assert raw[:2]==b'PK', raw[:100]
          print('DART_ZIP_OK',len(raw))
          z=zipfile.ZipFile(io.BytesIO(raw)); names=z.namelist(); print('ZIP_ENTRIES',len(names),names[:10])
          target=names[0]; data=z.read(target)
          print('TXT_FILE',target,'bytes',len(data))
          text=None
          for enc in ('utf-8-sig','cp949','euc-kr','utf-8'):
              try: text=data.decode(enc); print('ENCODING',enc); break
              except UnicodeDecodeError: pass
          assert text
          lines=text.splitlines()
          print('HEADER',lines[0][:4000])
          for line in lines[1:4]: print('SAMPLE',line[:4000])
          PY
