name: DART and Price Source Smoke

on:
  push:
    branches: ["connect-dart-price-data"]
    paths: [".github/workflows/dart-price-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify corrected Naver 60-row pagination
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 KR4/1.0','Referer':'https://m.stock.naver.com/','Accept':'application/json, text/plain, */*'})
          for code in ['005930','000250']:
              r=s.get(f'https://m.stock.naver.com/api/stock/{code}/integration',timeout=20); r.raise_for_status(); d=r.json()
              infos={x.get('code'):x.get('value') for x in d.get('totalInfos',[]) if isinstance(x,dict)}
              print('VALUATION',code,'lastClose',infos.get('lastClosePrice'),'eps',infos.get('eps'),'per',infos.get('per'))
              bars=[]
              for page in (1,2,3):
                  r=s.get(f'https://m.stock.naver.com/api/stock/{code}/price?pageSize=60&page={page}',timeout=20)
                  print('PRICE_STATUS',code,page,r.status_code); r.raise_for_status(); x=r.json(); assert isinstance(x,list)
                  print('PRICE_PAGE',code,page,'len',len(x),'newest',x[0].get('localTradedAt') if x else None,'oldest',x[-1].get('localTradedAt') if x else None)
                  bars.extend(x)
              assert len(bars) >= 120
              assert any((b.get('localTradedAt') or '') <= '2026-03-14' for b in bars), code
          PY
      - name: Verify official OpenDART public bulk PL is downloadable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,re,zipfile,requests
          base='https://opendart.fss.or.kr'; hdr={'User-Agent':'Mozilla/5.0 KR4/1.0','Referer':base+'/disclosureinfo/fnltt/dwld/main.do'}
          s=requests.Session(); s.get(base,headers=hdr,timeout=30).raise_for_status()
          html=s.post(base+'/disclosureinfo/fnltt/dwld/list.do',headers=hdr,timeout=60).text
          m=re.search(r"download_ext002\('2026','HY',\s*'PL',\s*'([^']+)'\)",html); assert m
          fn=m.group(1); r=s.get(base+'/cmm/downloadFnlttZip.do',params={'fl_nm':fn},headers=hdr,timeout=300)
          assert r.status_code==200 and r.content[:2]==b'PK'
          print('DART_BULK_OK',fn,len(r.content),len(zipfile.ZipFile(io.BytesIO(r.content)).namelist()))
          PY
