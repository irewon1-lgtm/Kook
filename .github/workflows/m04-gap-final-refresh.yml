name: KR4 M04 Legacy-Scale Final Refresh

on:
  push:
    branches:
      - fix/m04-gap-aware-ca-v1
    paths:
      - ".github/m04-gap-final-trigger"

permissions:
  contents: write

concurrency:
  group: kr4-m04-legacy-scale-final
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/m04-gap-aware-ca-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install only collector dependencies
        run: pip install requests pandas lxml

      - name: Freeze current main and reject stale code inputs
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_MAIN_SHA=$(git rev-parse origin/main)
          BASE_SNAPSHOT_SHA=$(git rev-parse origin/main:evidence/real_quant_snapshot.json)
          echo "BASE_MAIN_SHA=$BASE_MAIN_SHA" >> "$GITHUB_ENV"
          echo "BASE_SNAPSHOT_SHA=$BASE_SNAPSHOT_SHA" >> "$GITHUB_ENV"
          git show origin/main:evidence/real_quant_snapshot.json > /tmp/kr4_baseline.json
          git show origin/main:evidence/quarterly_history.json > /tmp/quarterly_history.json

          : > /tmp/critical-shas.txt
          for path in \
            scripts/collect_real_quant.py \
            scripts/collect_real_quant_v2.py \
            scripts/collect_real_quant_v3.py \
            scripts/apply_recent_dart_fallback.py \
            scripts/apply_fiscal_calendar_recovery.py \
            scripts/apply_standard_actual_recovery.py \
            scripts/standard_actual_core.py \
            app/src/main/java/com/krstock/v3/data/generated/GeneratedKospiMaster.kt \
            app/src/main/java/com/krstock/v3/data/generated/GeneratedKosdaqMaster.kt
          do
            MAIN_BLOB=$(git rev-parse "origin/main:$path")
            BRANCH_BLOB=$(git hash-object "$path")
            test "$MAIN_BLOB" = "$BRANCH_BLOB" || {
              echo "STALE_BRANCH_CODE $path main=$MAIN_BLOB branch=$BRANCH_BLOB"
              exit 1
            }
            echo "$MAIN_BLOB $path" >> /tmp/critical-shas.txt
          done
          QUARTERLY_BLOB=$(git rev-parse origin/main:evidence/quarterly_history.json)
          echo "$QUARTERLY_BLOB evidence/quarterly_history.json" >> /tmp/critical-shas.txt
          echo "BASELINE_INPUT_GATE_PASS main=$BASE_MAIN_SHA snapshot=$BASE_SNAPSHOT_SHA quarterly=$QUARTERLY_BLOB"

      - name: Patch permanent v2 and run deterministic regressions
        run: |
          set -euo pipefail
          python scripts/patch_legacy_scale_m04_to_v2.py
          python scripts/patch_legacy_scale_confirmation.py
          python scripts/replace_m04_tests_legacy_scale.py
          python -m py_compile scripts/collect_real_quant_v2.py
          python tests/test_m04_corporate_actions.py
          python tests/test_auto_update_pipeline.py
          cp scripts/collect_real_quant_v2.py /tmp/collect_real_quant_v2.py
          cp tests/test_m04_corporate_actions.py /tmp/test_m04_corporate_actions.py

      - name: Live scale fail-fast probe before full collection
        run: |
          set -euo pipefail
          python - <<'PY'
          import calendar,sys
          from datetime import date,timedelta
          sys.path.insert(0,'scripts')
          import collect_real_quant_v2 as v2
          import collect_real_quant_v3 as v3

          now=v3._kst_now(); as_of=now.date(); cutoff=v3.resolve_price_cutoff(as_of,now)
          month=cutoff.month-6; year=cutoff.year
          if month<=0: month+=12; year-=1
          target=date(year,month,min(cutoff.day,calendar.monthrange(year,month)[1]))
          lookup_start=target-timedelta(days=14)

          false_codes=['001230','000210','005290','003550','004020','006800','007340','002990','003200','000720']
          known={'134380':'split','331520':'reverse'}
          false_cutoff=[]
          summaries={}

          def inspect(code):
            raw,_factor,error=v2._parse_price_bars(code,cutoff,target)
            assert not error,(code,error)
            adj,legacy_error=v2._fetch_legacy_adjusted_closes(code,lookup_start,cutoff)
            assert not legacy_error and adj,(code,legacy_error,len(adj))
            value,reason,start,end=v2._legacy_adjusted_return(adj,target,cutoff)
            assert reason is None and value is not None,(code,reason,start,end)
            candidates=v2._detect_scale_transition_events(raw,adj,start,end)
            annotated=v2._annotate_action_types(code,[dict(e) for e in candidates])
            confirmed=[e for e in annotated if e.get('scale_stable_regimes') or e.get('notice_distance_days') is not None]
            return value,start,end,candidates,confirmed

          for code in false_codes:
            value,start,end,candidates,confirmed=inspect(code)
            hits=[e for e in confirmed if e['date']==cutoff]
            false_cutoff.extend((code,e) for e in hits)
            summaries[code]=(value,len(candidates),len(confirmed),hits)
            print('FALSE_CLUSTER_PROBE',code,'m04',value,'candidates',candidates,'confirmed',confirmed)

          assert not false_cutoff,false_cutoff
          assert summaries['001230'][2]==0,summaries['001230']

          for code,kind in known.items():
            value,start,end,candidates,confirmed=inspect(code)
            assert confirmed,(code,kind,value,candidates)
            ratios=[float(e['reset_ratio']) for e in confirmed]
            if kind=='split': assert any(r<0.25 for r in ratios),(code,ratios)
            else: assert any(r>3.0 for r in ratios),(code,ratios)
            assert -90.0<value<300.0,(code,value)
            print('KNOWN_CA_PROBE',code,kind,'m04',value,'events',confirmed)

          print('M04_LEGACY_SCALE_LIVE_PROBE_PASS',{'cutoff':str(cutoff),'false_cutoff_events':0})
          PY

      - name: Collect only four-metric app snapshot
        run: |
          set -euo pipefail
          python scripts/collect_real_quant_v3.py \
            --as-of auto \
            --price-cutoff auto \
            --workers 14 \
            --kotlin-out /tmp/GeneratedRealQuantSnapshot.kt \
            --evidence-out /tmp/real_quant_snapshot.json

      - name: Apply existing recovery chain without recollecting 8Q history
        run: |
          set -euo pipefail
          python scripts/apply_recent_dart_fallback.py \
            --quant /tmp/real_quant_snapshot.json \
            --history /tmp/quarterly_history.json \
            --out /tmp/real_quant_snapshot.json
          python scripts/apply_fiscal_calendar_recovery.py \
            --quant /tmp/real_quant_snapshot.json \
            --out /tmp/real_quant_snapshot.json \
            --kind-retries 3
          python scripts/apply_standard_actual_recovery.py \
            --quant /tmp/real_quant_snapshot.json \
            --out /tmp/real_quant_snapshot.json
          python - <<'PY'
          import json
          p='/tmp/real_quant_snapshot.json'
          d=json.load(open(p,encoding='utf-8'))
          auto=d.setdefault('auto_update',{})
          auto['m04_engine']='naver_legacy_adjusted_close_scale_regime_v1'
          auto['m04_price_source']='api.finance.naver.com/siseJson adjusted historical close'
          auto['corporate_action_detector']='mobile_raw_close / legacy_adjusted_close stable scale regime'
          auto['m03_corporate_action_policy']='polling EPS/PER fail-closed cross-check for confirmed scale transitions'
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open(p,'a',encoding='utf-8').write('\n')
          PY

      - name: Final four-metric and corporate-action gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,re
          from collections import Counter
          from datetime import date

          new=json.load(open('/tmp/real_quant_snapshot.json',encoding='utf-8'))
          old=json.load(open('/tmp/kr4_baseline.json',encoding='utf-8'))
          n=new['universe_count']
          assert n==old['universe_count']==len(new['records'])==2649
          assert set(new['records'])==set(old['records'])
          assert new.get('auto_update',{}).get('collector')=='collect_real_quant_v3.py'
          assert new.get('auto_update',{}).get('m04_engine')=='naver_legacy_adjusted_close_scale_regime_v1'
          snap=date.fromisoformat(new['snapshot_date_kst']); price=date.fromisoformat(new['price_cutoff_date_kst'])
          assert price<=snap and (snap-price).days<=10

          b=old['coverage']; c=new['coverage']
          floors={
            'm01_available':max(int(n*0.88),int(b['m01_available'])-55),
            'm02_available':max(int(n*0.84),int(b['m02_available'])-55),
            'm03_available':max(int(n*0.58),int(b['m03_available'])-20),
            'm04_available':max(int(n*0.96),int(b['m04_available'])-20),
            'complete_count':max(int(n*0.50),int(b['complete_count'])-40),
          }
          for key,floor in floors.items(): assert int(c[key])>=floor,(key,c[key],floor,b[key])
          assert c['ranked_count']==c['complete_count']

          ranks=[]; evt_stocks=0; evt_dates=Counter(); ca_blocks=Counter(); source_errors=0; legacy_basis=0
          for code,row in new['records'].items():
            assert re.fullmatch(r'[0-9A-Z]{6}',code),code
            metrics=[row[f'm0{i}'] for i in range(1,5)]
            for m in metrics:
              raw,pct,reason,basis=m['raw'],m['percentile'],m['reason'],m['basis']
              if raw is None: assert pct is None and reason,(code,m)
              else: assert math.isfinite(float(raw)) and pct is not None and 0<=float(pct)<=100 and basis,(code,m)
              if reason in {'NAVER_INTEGRATION_ERROR','NAVER_WORKER_EXCEPTION'}: source_errors+=1
            complete=all(m['raw'] is not None for m in metrics)
            assert (row['composite'] is not None)==complete,(code,'composite')
            assert (row['rank'] is not None)==complete,(code,'rank')
            if row['rank'] is not None: ranks.append(int(row['rank']))
            m04basis=str(row['m04'].get('basis') or '')
            if row['m04'].get('raw') is not None and 'NAVER_LEGACY_ADJUSTED_CLOSE' in m04basis: legacy_basis+=1
            dates=re.findall(r'_EVT(20\d{6}):',m04basis)
            if dates: evt_stocks+=1; evt_dates.update(dates)
            reason=str(row['m03'].get('reason') or '')
            if reason.startswith('CORPORATE_ACTION_PER_XCHECK_'): ca_blocks[reason]+=1

          assert sorted(ranks)==list(range(1,len(ranks)+1))
          assert source_errors<=15,source_errors
          assert legacy_basis==c['m04_available'],(legacy_basis,c['m04_available'])
          assert evt_dates['20260915']<20,evt_dates['20260915']
          top_date,top_count=(evt_dates.most_common(1)[0] if evt_dates else ('NONE',0))
          assert top_count<80,(top_date,top_count)
          assert sum(ca_blocks.values())<=30,ca_blocks
          for code in ['001230','000210','005290','003550','004020','006800','007340','002990','003200','000720']:
            assert 'EVT20260915' not in str(new['records'][code]['m04'].get('basis') or ''),(code,new['records'][code]['m04'])

          for code in {'006380','008290','046070','082660'}:
            assert new['records'][code]['m04'].get('raw') is not None,(code,new['records'][code]['m04'])

          miwon=float(new['records']['134380']['m04']['raw']); valof=float(new['records']['331520']['m04']['raw'])
          assert -80.0<miwon<200.0,miwon
          assert -90.0<valof<300.0,valof
          assert '_EVT' in str(new['records']['134380']['m04'].get('basis') or ''),new['records']['134380']['m04']
          assert '_EVT' in str(new['records']['331520']['m04'].get('basis') or ''),new['records']['331520']['m04']

          for mid in ('m01','m02','m03','m04'):
            counted=Counter('AVAILABLE' if row[mid]['raw'] is not None else (row[mid]['reason'] or 'UNKNOWN') for row in new['records'].values())
            assert dict(counted)==new['reason_counts'][mid],(mid,counted,new['reason_counts'][mid])

          summary={
            'snapshot':new['snapshot_date_kst'],'price':new['price_cutoff_date_kst'],
            'coverage_before':b,'coverage_after':c,'corporate_action_stocks':evt_stocks,
            'event_20260915':evt_dates['20260915'],'top_event_date':top_date,'top_event_count':top_count,
            'm03_ca_blocks':dict(ca_blocks),'miwon_m04':miwon,'valof_m04':valof,
          }
          json.dump(summary,open('/tmp/m04_legacy_final_summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('M04_LEGACY_SCALE_FINAL_GATE_PASS',json.dumps(summary,ensure_ascii=False))
          PY

      - name: Publish permanent engine plus app JSON only if main inputs stayed unchanged
        run: |
          set -euo pipefail
          git fetch origin main
          while read expected path; do
            current=$(git rev-parse "origin/main:$path")
            test "$current" = "$expected" || { echo "MAIN_INPUT_CHANGED_DURING_RUN $path expected=$expected current=$current"; exit 1; }
          done < /tmp/critical-shas.txt
          CURRENT_SNAPSHOT_SHA=$(git rev-parse origin/main:evidence/real_quant_snapshot.json)
          test "$CURRENT_SNAPSHOT_SHA" = "$BASE_SNAPSHOT_SHA" || { echo "MAIN_SNAPSHOT_CHANGED_DURING_RUN expected=$BASE_SNAPSHOT_SHA current=$CURRENT_SNAPSHOT_SHA"; exit 1; }

          SUMMARY=$(python - <<'PY'
          import json
          s=json.load(open('/tmp/m04_legacy_final_summary.json',encoding='utf-8')); c=s['coverage_after']
          print(f"M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']} evt0915={s['event_20260915']} CA={s['corporate_action_stocks']}")
          PY
          )

          git checkout -B m04-legacy-publish origin/main
          cp /tmp/collect_real_quant_v2.py scripts/collect_real_quant_v2.py
          cp /tmp/test_m04_corporate_actions.py tests/test_m04_corporate_actions.py
          cp /tmp/real_quant_snapshot.json evidence/real_quant_snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collect_real_quant_v2.py tests/test_m04_corporate_actions.py evidence/real_quant_snapshot.json
          git commit -m "[skip actions] Fix M04 adjusted prices and refresh KR4 app data: ${SUMMARY}"
          git push origin HEAD:main
