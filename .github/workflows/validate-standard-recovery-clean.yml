name: Validate Standard Recovery Clean Integration

on:
  push:
    branches:
      - fix/standard-actual-recovery-clean-v1
    paths:
      - scripts/apply_standard_actual_recovery.py
      - .github/workflows/collect-real-quant.yml
      - .github/workflows/standard-recovery-regression-guard.yml
      - .github/workflows/validate-standard-recovery-clean.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-standard-recovery-clean
  cancel-in-progress: true

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/standard-actual-recovery-clean-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q requests pandas lxml

      - name: Preserve latest-main-derived snapshot
        run: cp evidence/real_quant_snapshot.json /tmp/before_standard_clean.json

      - name: Self-test and apply production recovery
        run: |
          set -euo pipefail
          python scripts/apply_standard_actual_recovery.py --self-test
          (
            cd scripts
            python apply_standard_actual_recovery.py \
              --quant ../evidence/real_quant_snapshot.json \
              --out ../evidence/real_quant_snapshot.json
          )

      - name: Extreme immutable and current-M04 gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          b=json.load(open('/tmp/before_standard_clean.json',encoding='utf-8'))
          a=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          assert a['universe_count']==b['universe_count']==2649
          assert set(a['records'])==set(b['records'])
          bc=b['coverage']; ac=a['coverage']
          assert bc=={'m01_available':2504,'m02_available':2409,'m03_available':2639,'m04_available':2607,'complete_count':2379,'ranked_count':2379},bc
          assert ac['m01_available']>=bc['m01_available']
          assert ac['m02_available']>=bc['m02_available']
          assert ac['m03_available']==bc['m03_available']
          assert ac['m04_available']==bc['m04_available']
          assert ac['complete_count']>=bc['complete_count']
          assert ac['ranked_count']==ac['complete_count']
          r=a.get('standard_actual_recovery') or {}
          assert r.get('source_error_count')==0,r.get('source_errors')
          for code,old in b['records'].items():
              new=a['records'][code]
              for mid in ('m01','m02','m03','m04'):
                  if old[mid].get('raw') is not None:
                      assert new[mid].get('raw')==old[mid].get('raw'),(code,mid,'raw overwrite')
                      assert new[mid].get('basis')==old[mid].get('basis'),(code,mid,'basis overwrite')
              if old['m02'].get('reason')=='FINANCIAL_SECTOR_EXCLUDED':
                  assert new['m02'].get('raw') is None
                  assert new['m02'].get('reason')=='FINANCIAL_SECTOR_EXCLUDED'
          for mid in ('m01','m02','m03','m04'):
              counted={}
              for row in a['records'].values():
                  m=row[mid]
                  if m.get('raw') is None:
                      assert m.get('reason')
                      key=m.get('reason')
                  else:
                      assert math.isfinite(float(m['raw']))
                      assert m.get('basis')
                      key='AVAILABLE'
                  counted[key]=counted.get(key,0)+1
              assert a['reason_counts'][mid]==counted,(mid,a['reason_counts'][mid],counted)
          print('STANDARD_CLEAN_EXTREME_GATE_PASS',json.dumps({'before':bc,'after':ac,'recovery':{k:r.get(k) for k in ('candidate_count','m01_recovered','m02_recovered','promoted_complete_count')}},ensure_ascii=False))
          PY

      - name: Python regression suites
        run: |
          set -euo pipefail
          python tests/run_all.py evidence/standard_clean_run_all.json
          python tests/run_stress.py
          python tests/run_combo_rank_stress.py evidence/standard_clean_combo.json

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: JVM regression and Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit validated recovered snapshot
        run: |
          set -euo pipefail
          git add evidence/real_quant_snapshot.json
          if git diff --cached --quiet; then
            echo 'Snapshot already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          COV=$(python - <<'PY'
          import json
          c=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))['coverage']
          print(f"M01={c['m01_available']} M02={c['m02_available']} M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']}")
          PY
          )
          git commit -m "Apply standard actual recovery on M04-adjusted main: ${COV}"
          git pull --rebase origin fix/standard-actual-recovery-clean-v1
          git push origin HEAD:fix/standard-actual-recovery-clean-v1
