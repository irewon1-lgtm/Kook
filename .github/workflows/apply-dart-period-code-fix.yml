name: Apply OpenDART Period Code Fix

on:
  push:
    branches:
      - "feature/quarterly-history-v1"
    paths:
      - ".github/workflows/apply-dart-period-code-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quarterly-history-v1
          fetch-depth: 0
      - name: Patch real OpenDART FQ/TQ codes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/collect_quarterly_history.py')
          s=p.read_text(encoding='utf-8')
          old='PERIOD_TO_Q = {"Q1": 1, "1Q": 1, "HY": 2, "Q3": 3, "3Q": 3, "FY": 4}'
          new='PERIOD_TO_Q = {"FQ": 1, "Q1": 1, "1Q": 1, "HY": 2, "TQ": 3, "Q3": 3, "3Q": 3, "FY": 4}'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          t=Path('tests/test_quarterly_history.py')
          s=t.read_text(encoding='utf-8')
          s=s.replace("download_ext002('2025','1Q','PL','2025_Q1_PL.zip');", "download_ext002('2025','FQ','PL','2025_Q1_PL.zip');")
          s=s.replace("download_ext002('2025','3Q','PL','2025_Q3_PL.zip');", "download_ext002('2025','TQ','PL','2025_Q3_PL.zip');")
          s=s.replace('assert [row[1] for row in rows] == ["1Q", "HY", "3Q", "FY"], rows', 'assert [row[1] for row in rows] == ["FQ", "HY", "TQ", "FY"], rows')
          s=s.replace('assert qh.PERIOD_TO_Q["1Q"] == 1 and qh.PERIOD_TO_Q["3Q"] == 3', 'assert qh.PERIOD_TO_Q["FQ"] == 1 and qh.PERIOD_TO_Q["TQ"] == 3')
          t.write_text(s,encoding='utf-8')
          PY
          python tests/test_quarterly_history.py
      - name: Commit
        run: |
          set -euo pipefail
          git add scripts/collect_quarterly_history.py tests/test_quarterly_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix OpenDART FQ/TQ quarter-code mapping"
          git push origin HEAD:feature/quarterly-history-v1
