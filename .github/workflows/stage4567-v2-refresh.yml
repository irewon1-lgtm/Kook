name: KR4 Independent Financial Facts

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Resume validated official raw responses from a prior run of this collector'
        required: false
        type: string
  schedule:
    # Independent daily recovery after the two quant collection windows (KST).
    - cron: '50 9 * * 1-5'
    - cron: '50 13 * * 1-5'
  workflow_run:
    workflows: ['Collect Real KR4 Quant Snapshot']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/collect_financial_safety_verified.py'
      - 'scripts/dart_filing_provenance.py'
      - 'tests/test_financial_safety_provenance.py'
      - 'tests/test_dart_filing_provenance.py'
      - '.github/workflows/stage4567-v2-refresh.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: kr4-independent-financial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-financial-facts:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official-source collector dependencies
        run: pip install requests pytest
      - name: Financial provenance and unchanged-policy regression tests
        run: |
          python -m pytest -q tests/test_dart_filing_provenance.py tests/test_financial_safety_provenance.py
          python scripts/collect_financial_safety.py --self-test
      - name: Preserve read-only quant baseline
        run: |
          mkdir -p evidence/ci/financial
          cp evidence/real_quant_snapshot.json "$RUNNER_TEMP/kr4-financial-quant-baseline.json"
      - name: Download previous official raw observations for bounded retry
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: KR4_Official_Financial_Collection
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-financial
      - name: Resume hash-validated official raw cache
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kr4-financial-raw"
          cp -a "$RUNNER_TEMP/previous-financial/_temp/kr4-financial-raw/." "$RUNNER_TEMP/kr4-financial-raw/"
      - name: Collect actual official BS and latest filing evidence
        run: |
          python -u scripts/collect_financial_safety_verified.py \
            --quant evidence/real_quant_snapshot.json \
            --out "$RUNNER_TEMP/financial_safety_snapshot.json" \
            --cache "$RUNNER_TEMP/kr4-financial-raw" --workers 4
      - name: Validate full-universe facts and official-source availability
        run: |
          python - <<'PY'
          import collections, hashlib, json
          from pathlib import Path
          import os
          q=Path('evidence/real_quant_snapshot.json')
          assert q.read_bytes()==Path(os.environ['RUNNER_TEMP'],'kr4-financial-quant-baseline.json').read_bytes(), 'quant_must_not_change'
          s=json.loads(Path(os.environ['RUNNER_TEMP'],'financial_safety_snapshot.json').read_text())
          original=json.loads(q.read_text())
          assert s['schema_version']==2 and s['policy_version']=='STAGE4_BS_SAFETY_V1'
          assert s['snapshot_date_kst']==original['snapshot_date_kst']
          assert set(s['records'])==set(original['records']) and len(s['records'])==2649
          assert s['thresholds']=={'debt_to_equity_max_pct':400.0,'current_ratio_min_pct':70.0,'accounting_identity_tolerance_pct':5.0}
          counts=collections.Counter(r['status'] for r in s['records'].values())
          assert sum(counts.values())==s['coverage']['total']==2649
          for status,key in [('PASS','pass'),('FAIL','fail'),('HOLD','hold'),('NOT_APPLICABLE','not_applicable')]:
              assert counts[status]==s['coverage'][key]
          errors={c:r for c,r in s['records'].items() if any(x in ('COLLECTION_ERROR','SOURCE_UNAVAILABLE','STALE_CORRECTION_CHECK') for x in r['validation_issues'])}
          print('ACTUAL_FINANCIAL_COVERAGE',json.dumps(s['coverage'],ensure_ascii=False))
          assert not errors, f'official_source_unavailable_for_{len(errors)}_issuers; no false complete claim'
          Path('evidence/ci/financial/collection-verification.json').write_text(json.dumps({'status':'PASS','event':os.environ['GITHUB_EVENT_NAME'],'quantUnchanged':True,'coverage':s['coverage'],'commit':os.environ['GITHUB_SHA']},ensure_ascii=False,indent=2))
          PY
      - name: Publish independent facts without modifying quant or ranks
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          current=json.loads(subprocess.check_output(['git','show','origin/main:evidence/real_quant_snapshot.json']))
          s=json.loads(Path(os.environ['RUNNER_TEMP'],'financial_safety_snapshot.json').read_text())
          assert current['snapshot_date_kst']==s['snapshot_date_kst'] and set(current['records'])==set(s['records']), 'quant_date_or_identity_moved_during_collection'
          PY
          cp "$RUNNER_TEMP/financial_safety_snapshot.json" evidence/financial_safety_snapshot.json
          git add evidence/financial_safety_snapshot.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Refresh independent verified financial facts'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve raw official responses, source hashes and actual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KR4_Official_Financial_Collection
          path: |
            ${{ runner.temp }}/financial_safety_snapshot.json
            ${{ runner.temp }}/kr4-financial-raw/
            evidence/ci/financial/
          if-no-files-found: warn
          retention-days: 30
