name: M04 Live Gap Diagnostic

on:
  push:
    branches:
      - fix/m04-exceptional-trading-days
    paths:
      - "scripts/diagnose_m04_live_gaps.py"
      - ".github/workflows/m04-live-gap-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Print exceptional M04 live gaps
        run: python3 scripts/diagnose_m04_live_gaps.py
