name: KR4 Probe Final Five Recovery

on:
  push:
    branches:
      - fix/incomplete-267-recovery-v1
    paths:
      - scripts/probe_final_five_recovery.py
      - .github/workflows/probe-final-five-recovery.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incomplete-267-recovery-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pandas lxml
      - name: Probe final five
        run: PYTHONPATH=scripts python scripts/probe_final_five_recovery.py
      - name: Verify probe
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/final_five_recovery_probe.json',encoding='utf-8'))
          assert p['codes']==['0120G0','365270','372320','388870','475830']
          assert p['error_count']==0,p['errors']
          print('FINAL_FIVE_PROBE_PASS')
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/final_five_recovery_probe.json
          git commit -m 'Record final five KR4 recovery probe'
          git pull --rebase origin fix/incomplete-267-recovery-v1
          git push origin HEAD:fix/incomplete-267-recovery-v1
