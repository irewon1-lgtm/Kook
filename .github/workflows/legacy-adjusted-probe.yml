name: KR4 Legacy Adjusted Price Probe

on:
  push:
    branches:
      - fix/m04-gap-aware-ca-v1
    paths:
      - ".github/legacy-price-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe 001230 134380 331520 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, json, urllib.parse, urllib.request
          from datetime import date

          UA={'User-Agent':'Mozilla/5.0','Referer':'https://finance.naver.com/'}

          def text(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.read().decode('utf-8')

          def legacy(code,start,end):
              q=urllib.parse.urlencode({
                  'symbol':code,'requestType':1,'startTime':start,
                  'endTime':end,'timeframe':'day'
              })
              raw=text('https://api.finance.naver.com/siseJson.naver?'+q)
              rows=ast.literal_eval(raw.strip())
              header=[str(x).strip() for x in rows[0]]
              di=header.index('날짜'); ci=header.index('종가')
              out={}
              for row in rows[1:]:
                  if not isinstance(row,(list,tuple)) or len(row)<=max(di,ci): continue
                  ds=str(row[di]).strip()
                  try: close=float(row[ci])
                  except Exception: continue
                  out[ds]=close
              return out

          def mobile(code):
              out={}
              for page in range(1,5):
                  raw=text(f'https://m.stock.naver.com/api/stock/{code}/price?pageSize=60&page={page}')
                  rows=json.loads(raw)
                  if not isinstance(rows,list) or not rows: break
                  for row in rows:
                      ds=str(row.get('localTradedAt') or '').replace('-','')[:8]
                      try: close=float(str(row.get('closePrice') or '').replace(',',''))
                      except Exception: continue
                      out[ds]=(close,row)
                  if len(rows)<60: break
              return out

          cases={
              '001230':('20260911','20260915',['20260911','20260914','20260915']),
              '134380':('20260325','20260420',['20260331','20260401','20260402','20260413','20260414']),
              '331520':('20260420','20260522',['20260423','20260424','20260430','20260518','20260519']),
          }
          summaries={}
          for code,(start,end,focus) in cases.items():
              adj=legacy(code,start,end)
              mob=mobile(code)
              print('\n===',code,'===')
              rows=[]
              for ds in focus:
                  a=adj.get(ds); m=mob.get(ds)
                  scale=(m[0]/a if a and m else None)
                  row={'date':ds,'legacy_adjusted_close':a,'mobile_close':m[0] if m else None,'scale':scale}
                  if m:
                      row['mobile_change']=m[1].get('compareToPreviousClosePrice')
                      row['mobile_ratio']=m[1].get('fluctuationsRatio')
                      row['mobile_direction']=m[1].get('compareToPreviousPrice')
                  rows.append(row)
                  print(json.dumps(row,ensure_ascii=False,default=str))
              summaries[code]=rows

          # 001230 must match the verified regular-market historical close.
          assert legacy('001230','20260914','20260915').get('20260914')==2135.0
          assert legacy('001230','20260914','20260915').get('20260915')==2110.0

          # Legacy series must overlap both known corporate-action windows.
          assert len(legacy('134380','20260325','20260420'))>=2
          assert len(legacy('331520','20260420','20260522'))>=2
          print('\nLEGACY_ADJUSTED_THREE_STOCK_PROBE_PASS')
          PY
