name: KR4 Standard Recovery Regression Guard

on:
  push:
    branches:
      - main
      - fix/incomplete-267-recovery-v1
    paths:
      - evidence/real_quant_snapshot.json
      - scripts/apply_standard_actual_recovery.py
      - .github/workflows/standard-recovery-regression-guard.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr4-standard-recovery-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-if-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q requests pandas lxml

      - name: Validate current production recovery policy
        run: |
          set -euo pipefail
          python scripts/apply_standard_actual_recovery.py --self-test
          cp evidence/real_quant_snapshot.json /tmp/before_guard.json

      - name: Re-apply latest standard recovery idempotently
        working-directory: scripts
        run: |
          set -euo pipefail
          python apply_standard_actual_recovery.py \
            --quant ../evidence/real_quant_snapshot.json \
            --out ../evidence/real_quant_snapshot.json

      - name: Extreme non-regression gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          b=json.load(open('/tmp/before_guard.json',encoding='utf-8'))
          a=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          assert a['universe_count']==b['universe_count']==2649
          assert set(a['records'])==set(b['records'])
          bc=b['coverage']; ac=a['coverage']
          assert ac['m01_available']>=bc['m01_available'],(bc,ac)
          assert ac['m02_available']>=bc['m02_available'],(bc,ac)
          assert ac['m03_available']==bc['m03_available'],(bc,ac)
          assert ac['m04_available']==bc['m04_available'],(bc,ac)
          assert ac['complete_count']>=bc['complete_count'],(bc,ac)
          assert ac['ranked_count']==ac['complete_count']
          recovery=a.get('standard_actual_recovery') or {}
          assert recovery.get('source_error_count')==0,recovery.get('source_errors')
          for mid in ('m01','m02','m03','m04'):
              counted={}
              for row in a['records'].values():
                  m=row[mid]
                  raw=m.get('raw')
                  if raw is not None:
                      assert math.isfinite(float(raw)),(mid,row.get('name'),raw)
                      key='AVAILABLE'
                  else:
                      assert m.get('reason'),(mid,row.get('name'))
                      key=m.get('reason')
                  counted[key]=counted.get(key,0)+1
              assert a['reason_counts'][mid]==counted,(mid,a['reason_counts'][mid],counted)
          for code,old in b['records'].items():
              new=a['records'][code]
              if old['m02'].get('reason')=='FINANCIAL_SECTOR_EXCLUDED':
                  assert new['m02'].get('raw') is None
                  assert new['m02'].get('reason')=='FINANCIAL_SECTOR_EXCLUDED'
              for mid in ('m03','m04'):
                  assert new[mid].get('raw')==old[mid].get('raw'),(code,mid,'raw changed')
                  assert new[mid].get('basis')==old[mid].get('basis'),(code,mid,'basis changed')
          print('STANDARD_RECOVERY_REGRESSION_GUARD_PASS',json.dumps({'before':bc,'after':ac},ensure_ascii=False))
          PY

      - name: Commit repair with race-safe latest-head retry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4; do
            echo "RACE_SAFE_ATTEMPT=${attempt}"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp evidence/real_quant_snapshot.json /tmp/retry_before.json

            (
              cd scripts
              python apply_standard_actual_recovery.py \
                --quant ../evidence/real_quant_snapshot.json \
                --out ../evidence/real_quant_snapshot.json
            )

            python - <<'PY'
          import json
          b=json.load(open('/tmp/retry_before.json',encoding='utf-8'))
          a=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          bc=b['coverage']; ac=a['coverage']
          assert a['universe_count']==b['universe_count']==2649
          assert set(a['records'])==set(b['records'])
          assert ac['m01_available']>=bc['m01_available'],(bc,ac)
          assert ac['m02_available']>=bc['m02_available'],(bc,ac)
          assert ac['m03_available']==bc['m03_available'],(bc,ac)
          assert ac['m04_available']==bc['m04_available'],(bc,ac)
          assert ac['complete_count']>=bc['complete_count'],(bc,ac)
          assert ac['ranked_count']==ac['complete_count']
          assert (a.get('standard_actual_recovery') or {}).get('source_error_count')==0
          print('RACE_SAFE_REAPPLY_GATE_PASS',json.dumps({'before':bc,'after':ac},ensure_ascii=False))
          PY

            git add evidence/real_quant_snapshot.json
            if git diff --cached --quiet; then
              echo 'Latest branch snapshot already conforms to the latest recovery policy.'
              exit 0
            fi

            COV=$(python - <<'PY'
          import json
          d=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8')); c=d['coverage']
          print(f"M01={c['m01_available']} M02={c['m02_available']} M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']}")
          PY
          )
            git commit -m "Repair KR4 snapshot to latest standard recovery policy: ${COV}"

            if git push origin "HEAD:${BRANCH}"; then
              echo "RACE_SAFE_PUSH_PASS attempt=${attempt}"
              exit 0
            fi

            echo "Concurrent writer moved ${BRANCH}; recomputing from newest remote head."
            sleep $((attempt * 2))
          done

          echo 'Failed to converge after four race-safe attempts.' >&2
          exit 1
