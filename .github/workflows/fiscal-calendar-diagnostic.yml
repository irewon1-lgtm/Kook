name: Fiscal Calendar Diagnostic

on:
  push:
    branches:
      - fix/fiscal-calendar-aware-dart-v1
    paths:
      - "scripts/diagnose_fiscal_calendar.py"
      - "scripts/diagnose_naver_fiscal_quarter.py"
      - ".github/workflows/fiscal-calendar-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas lxml
      - name: Probe Naver actual quarter data
        run: |
          set -euo pipefail
          python scripts/diagnose_naver_fiscal_quarter.py | tee fiscal-calendar-diagnostic.log
      - name: Run live KIND/DART fiscal diagnostic
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/diagnose_fiscal_calendar.py | tee -a fiscal-calendar-diagnostic.log
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KR4_Fiscal_Calendar_Diagnostic
          path: fiscal-calendar-diagnostic.log
          retention-days: 7
