name: Patch Corporate Action Ratio Sign

on:
  push:
    branches:
      - fix/corporate-action-ratio-sign-cleanpass
    paths:
      - .github/workflows/patch-ca-ratio-sign.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/corporate-action-ratio-sign-cleanpass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Apply patch and run regressions
        run: |
          set -euo pipefail
          python scripts/patch_ca_ratio_sign.py
          python tests/test_m04_corporate_actions.py
          python tests/test_auto_update_pipeline.py
      - name: Commit patched source and tests
        run: |
          set -euo pipefail
          rm .github/workflows/patch-ca-ratio-sign.yml scripts/patch_ca_ratio_sign.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Naver price-history sign handling in corporate-action scan"
          git push origin HEAD:fix/corporate-action-ratio-sign-cleanpass
