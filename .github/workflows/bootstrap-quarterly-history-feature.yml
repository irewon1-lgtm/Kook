name: Bootstrap Quarterly History Feature

on:
  push:
    branches:
      - "feature/quarterly-history-v1"
    paths:
      - ".github/workflows/bootstrap-quarterly-history-feature.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr4-quarterly-bootstrap-feature
  cancel-in-progress: true

# Q1/Q3-capable OpenDART parser and contiguous-quarter gate are required before promotion.
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quarterly-history-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Unit adversarial tests
        run: python tests/test_quarterly_history.py
      - name: Collect real OpenDART 8-quarter history in parallel
        run: |
          set -euo pipefail
          python scripts/collect_quarterly_history_parallel.py \
            --as-of 2026-09-15 \
            --visible-quarters 8 \
            --support-quarters 12 \
            --period-workers 3 \
            --out /tmp/quarterly_history.json
      - name: Extreme gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math
          d=json.load(open('/tmp/quarterly_history.json',encoding='utf-8'))
          n=2649
          assert d['schema_version']==1
          assert len(d['records'])==n
          periods=d['target_periods']
          assert len(periods)==8 and len(set(periods))==8,periods
          indexes=[int(p[:4])*4+int(p[-1]) for p in periods]
          assert indexes==list(range(indexes[0],indexes[0]+8)),('NON_CONTIGUOUS_VISIBLE_QUARTERS',periods)
          proof=d['download_proof']
          assert len(proof)==12, len(proof)
          support=[x['period'] for x in proof]
          support_indexes=[int(p[:4])*4+int(p[-1]) for p in support]
          assert support_indexes==list(range(support_indexes[0],support_indexes[0]+12)),('NON_CONTIGUOUS_SUPPORT_QUARTERS',support)
          assert any(p.endswith('Q1') for p in support),support
          assert any(p.endswith('Q3') for p in support),support
          c=d['coverage']
          floors={
            'stocks_with_1q':int(n*0.78),
            'stocks_with_4q':int(n*0.62),
            'stocks_with_8q':int(n*0.45),
            'stocks_with_4q_margin':int(n*0.52),
            'stocks_with_8q_margin':int(n*0.36),
          }
          for k,v in floors.items(): assert int(c[k])>=v,(k,c[k],v)
          for code,r in d['records'].items():
            assert len(r['points'])==8,(code,len(r['points']))
            point_periods=[p['period'] for p in r['points']]
            assert point_periods==periods,(code,point_periods,periods)
            for p in r['points']:
              for k in ('revenue','operating_income','operating_margin','revenue_yoy','revenue_qoq'):
                v=p[k]; assert v is None or math.isfinite(float(v)),(code,p['period'],k,v)
              if p['revenue'] is None: assert p['reason'],(code,p)
          for code in ('005930','000660','000250'):
            assert sum(p['revenue'] is not None for p in d['records'][code]['points'])>=4,(code,d['records'][code]['points'])
          print('BOOTSTRAP_QUARTERLY_EXTREME_PASS',json.dumps({'support':support,'periods':periods,'coverage':c,'floors':floors},ensure_ascii=False))
          PY
      - name: Promote and commit generated history
        run: |
          set -euo pipefail
          git pull --rebase origin feature/quarterly-history-v1
          cp /tmp/quarterly_history.json evidence/quarterly_history.json
          cp /tmp/quarterly_history.json app/src/main/assets/quarterly_history.json
          git add evidence/quarterly_history.json app/src/main/assets/quarterly_history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bootstrap verified contiguous 8-quarter OpenDART history"
          git push origin HEAD:feature/quarterly-history-v1
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: Quarterly_History_Bootstrap_Proof
          path: /tmp/quarterly_history.json
          retention-days: 14
