name: Apply Recent DART Fallback

on:
  workflow_run:
    workflows:
      - "Collect Real KR4 Quant Snapshot"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/q1-dart-fallback-recovery
    paths:
      - "scripts/apply_recent_dart_fallback.py"
      - ".github/workflows/apply-recent-dart-fallback.yml"

permissions:
  contents: write

concurrency:
  group: kr4-recent-dart-fallback-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  apply-fallback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test fallback policy
        run: |
          set -euo pipefail
          python scripts/apply_recent_dart_fallback.py --self-test

      - name: Apply one-quarter actual-DART fallback
        run: |
          set -euo pipefail
          cp evidence/real_quant_snapshot.json /tmp/kr4_before_recent_dart_fallback.json
          python scripts/apply_recent_dart_fallback.py \
            --quant evidence/real_quant_snapshot.json \
            --history evidence/quarterly_history.json

      - name: Extreme recovery quality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re
          before=json.load(open('/tmp/kr4_before_recent_dart_fallback.json',encoding='utf-8'))
          after=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          assert before['universe_count']==after['universe_count']==2649
          assert set(before['records'])==set(after['records'])
          rec=after.get('recent_dart_fallback') or {}
          assert rec.get('policy')=='one-quarter-back validated OpenDART history only; no multi-quarter skip',rec
          assert int(rec.get('m01_recovered',-1))>=0 and int(rec.get('m02_recovered',-1))>=0,rec
          b=before['coverage']; a=after['coverage']
          for key in ('m01_available','m02_available','m03_available','m04_available','complete_count','ranked_count'):
            assert int(a[key])>=int(b[key]),(key,b[key],a[key])
          assert a['complete_count']==a['ranked_count']
          ranks=[]
          for code,r in after['records'].items():
            assert re.fullmatch(r'[0-9A-Z]{6}',code),code
            complete=True
            for i in range(1,5):
              m=r[f'm0{i}']; raw=m['raw']; pct=m['percentile']
              if raw is None:
                complete=False; assert pct is None and m['reason'],(code,i,m)
              else:
                assert math.isfinite(float(raw)) and pct is not None and 0<=float(pct)<=100 and m['basis'],(code,i,m)
                if i==3 and float(raw)<0: assert float(pct)==0.0,(code,m)
            assert (r['composite'] is not None)==complete,(code,'composite')
            assert (r['rank'] is not None)==complete,(code,'rank')
            if r['rank'] is not None: ranks.append(int(r['rank']))
          assert sorted(ranks)==list(range(1,len(ranks)+1))
          print('RECENT_DART_EXTREME_GATE_PASS',json.dumps({'before':b,'after':a,'recovery':rec},ensure_ascii=False))
          PY

      - name: Commit recovered remote snapshot on main only
        if: github.event_name == 'workflow_run' || github.ref_name == 'main'
        run: |
          set -euo pipefail
          # The previous validation step intentionally modified the working copy.
          # Restore it before rebasing, then re-apply against the newest main so
          # a concurrent data/signing commit cannot be overwritten or block pull.
          git restore --source=HEAD --worktree --staged evidence/real_quant_snapshot.json
          git pull --rebase origin main
          python scripts/apply_recent_dart_fallback.py \
            --quant evidence/real_quant_snapshot.json \
            --history evidence/quarterly_history.json
          git add evidence/real_quant_snapshot.json
          if git diff --cached --quiet; then
            echo "No one-quarter DART fallback change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COV=$(python - <<'PY'
          import json
          d=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          c=d['coverage']; r=d['recent_dart_fallback']
          print(f"M01={c['m01_available']} M02={c['m02_available']} M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']} fallbackM01={r['m01_recovered']} fallbackM02={r['m02_recovered']} source={r['source_period']}")
          PY
          )
          git commit -m "Apply recent DART fallback: ${COV}"
          git push origin HEAD:main

      - name: Upload fallback proof
        uses: actions/upload-artifact@v4
        with:
          name: KR4_Recent_DART_Fallback_Proof
          path: |
            evidence/real_quant_snapshot.json
            evidence/quarterly_history.json
          if-no-files-found: error
          retention-days: 14
