name: Apply Recent DART Fallback

on:
  workflow_run:
    workflows:
      - "Collect Real KR4 Quant Snapshot"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/q1-dart-fallback-recovery
      - fix/fiscal-calendar-aware-dart-v1
    paths:
      - "scripts/apply_recent_dart_fallback.py"
      - "scripts/apply_fiscal_calendar_recovery.py"
      - ".github/workflows/apply-recent-dart-fallback.yml"

permissions:
  contents: write

concurrency:
  group: kr4-recent-dart-fallback-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  apply-fallback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install recovery dependencies
        run: pip install requests pandas lxml

      - name: Self-test recovery policies
        run: |
          set -euo pipefail
          python scripts/apply_recent_dart_fallback.py --self-test
          python scripts/apply_fiscal_calendar_recovery.py --self-test

      - name: Apply validated DART and fiscal-calendar recoveries
        run: |
          set -euo pipefail
          cp evidence/real_quant_snapshot.json /tmp/kr4_before_recovery.json
          python scripts/apply_recent_dart_fallback.py \
            --quant evidence/real_quant_snapshot.json \
            --history evidence/quarterly_history.json
          python scripts/apply_fiscal_calendar_recovery.py \
            --quant evidence/real_quant_snapshot.json

      - name: Extreme recovery and economic-rank quality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re
          before=json.load(open('/tmp/kr4_before_recovery.json',encoding='utf-8'))
          after=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          assert before['universe_count']==after['universe_count']==2649
          assert set(before['records'])==set(after['records'])
          dart=after.get('recent_dart_fallback') or {}
          fiscal=after.get('fiscal_calendar_recovery') or {}
          assert 'final economic fail-close + full rerank' in str(dart.get('policy')),dart
          eg=dart.get('economic_guard') or {}
          assert eg.get('m01_range')==[-100.0,5000.0],eg
          assert eg.get('m02_range')==[-5000.0,200.0],eg
          assert fiscal.get('policy')=='non-December fiscal issuers only; latest completed Naver actual quarter; consensus rejected; existing numeric metrics preserved',fiscal
          assert not fiscal.get('source_errors'),fiscal.get('source_errors')

          b=before['coverage']; a=after['coverage']
          pre_m01={code for code,r in before['records'].items() if r['m01']['raw'] is not None and not (-100.0<=float(r['m01']['raw'])<=5000.0)}
          pre_m02={code for code,r in before['records'].items() if r['m02']['raw'] is not None and not (-5000.0<=float(r['m02']['raw'])<=200.0)}
          pre_complete_guard={code for code in pre_m01|pre_m02 if before['records'][code].get('composite') is not None}
          assert int(a['m01_available'])>=int(b['m01_available'])-len(pre_m01),(b,a,pre_m01)
          assert int(a['m02_available'])>=int(b['m02_available'])-len(pre_m02),(b,a,pre_m02)
          assert int(a['m03_available'])==int(b['m03_available']),(b,a)
          assert int(a['m04_available'])==int(b['m04_available']),(b,a)
          assert int(a['complete_count'])>=int(b['complete_count'])-len(pre_complete_guard),(b,a,pre_complete_guard)
          assert a['complete_count']==a['ranked_count']

          ranks=[]; guarded_m01=[]; guarded_m02=[]
          for code,r in after['records'].items():
            assert re.fullmatch(r'[0-9A-Z]{6}',code),code
            complete=True
            for i in range(1,5):
              m=r[f'm0{i}']; raw=m['raw']; pct=m['percentile']
              if raw is None:
                complete=False; assert pct is None and m['reason'],(code,i,m)
                if m['reason']=='M01_ECONOMIC_OUTLIER_GUARD': guarded_m01.append(code)
                if m['reason']=='M02_ECONOMIC_OUTLIER_GUARD': guarded_m02.append(code)
              else:
                v=float(raw)
                assert math.isfinite(v) and pct is not None and 0<=float(pct)<=100 and m['basis'],(code,i,m)
                if i==1: assert -100.0<=v<=5000.0,(code,m)
                if i==2: assert -5000.0<=v<=200.0,(code,m)
                if i==3 and v<0: assert float(pct)==0.0,(code,m)
            assert (r['composite'] is not None)==complete,(code,'composite')
            assert (r['rank'] is not None)==complete,(code,'rank')
            if r['rank'] is not None: ranks.append(int(r['rank']))
          assert sorted(ranks)==list(range(1,len(ranks)+1))
          assert pre_m01.issubset(set(guarded_m01)),(pre_m01,guarded_m01)
          assert pre_m02.issubset(set(guarded_m02)),(pre_m02,guarded_m02)
          print('RECOVERY_CHAIN_EXTREME_PASS',json.dumps({
            'before':b,'after':a,
            'pre_guard_m01':len(pre_m01),'pre_guard_m02':len(pre_m02),
            'guarded_m01_total':len(guarded_m01),'guarded_m02_total':len(guarded_m02),
            'dart':dart,'fiscal':fiscal,
          },ensure_ascii=False))
          PY

      - name: Commit recovered remote snapshot on main only
        if: github.event_name == 'workflow_run' || github.ref_name == 'main'
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree --staged evidence/real_quant_snapshot.json
          git pull --rebase origin main
          python scripts/apply_recent_dart_fallback.py \
            --quant evidence/real_quant_snapshot.json \
            --history evidence/quarterly_history.json
          python scripts/apply_fiscal_calendar_recovery.py \
            --quant evidence/real_quant_snapshot.json
          git add evidence/real_quant_snapshot.json
          if git diff --cached --quiet; then
            echo "No recovery change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COV=$(python - <<'PY'
          import json
          d=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          c=d['coverage']; dr=d['recent_dart_fallback']; fr=d['fiscal_calendar_recovery']
          eg=dr.get('economic_guard') or {}
          print(f"M01={c['m01_available']} M02={c['m02_available']} M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']} guardM01={len(eg.get('m01_excluded_codes') or [])} guardM02={len(eg.get('m02_excluded_codes') or [])} dartM01={dr['m01_recovered']} dartM02={dr['m02_recovered']} fiscalM01={fr['m01_recovered']} fiscalM02={fr['m02_recovered']}")
          PY
          )
          git commit -m "Apply KR4 recovery + economic rank guard: ${COV}"
          git push origin HEAD:main

      - name: Upload recovery proof
        uses: actions/upload-artifact@v4
        with:
          name: KR4_Recovery_Chain_Proof
          path: |
            evidence/real_quant_snapshot.json
            evidence/quarterly_history.json
          if-no-files-found: error
          retention-days: 14
