name: Apply Recent DART Fallback

on:
  workflow_run:
    workflows:
      - "Collect Real KR4 Quant Snapshot"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/q1-dart-fallback-recovery
      - fix/fiscal-calendar-aware-dart-v1
    paths:
      - "scripts/apply_recent_dart_fallback.py"
      - "scripts/apply_fiscal_calendar_recovery.py"
      - ".github/workflows/apply-recent-dart-fallback.yml"

permissions:
  contents: write

concurrency:
  group: kr4-recent-dart-fallback-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  apply-fallback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install recovery dependencies
        run: pip install requests pandas lxml

      - name: Self-test recovery policies
        run: |
          set -euo pipefail
          python scripts/apply_recent_dart_fallback.py --self-test
          python scripts/apply_fiscal_calendar_recovery.py --self-test

      - name: Apply validated DART and fiscal-calendar recoveries
        run: |
          set -euo pipefail
          cp evidence/real_quant_snapshot.json /tmp/kr4_before_recovery.json
          python scripts/apply_recent_dart_fallback.py \
            --quant evidence/real_quant_snapshot.json \
            --history evidence/quarterly_history.json
          python scripts/apply_fiscal_calendar_recovery.py \
            --quant evidence/real_quant_snapshot.json

      - name: Extreme recovery quality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re
          before=json.load(open('/tmp/kr4_before_recovery.json',encoding='utf-8'))
          after=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          assert before['universe_count']==after['universe_count']==2649
          assert set(before['records'])==set(after['records'])
          dart=after.get('recent_dart_fallback') or {}
          fiscal=after.get('fiscal_calendar_recovery') or {}
          assert dart.get('policy')=='one-quarter-back validated OpenDART history only; no multi-quarter skip',dart
          assert fiscal.get('policy')=='non-December fiscal issuers only; latest completed Naver actual quarter; consensus rejected; existing numeric metrics preserved',fiscal
          assert not fiscal.get('source_errors'),fiscal.get('source_errors')
          b=before['coverage']; a=after['coverage']
          for key in ('m01_available','m02_available','m03_available','m04_available','complete_count','ranked_count'):
            assert int(a[key])>=int(b[key]),(key,b[key],a[key])
          assert a['complete_count']==a['ranked_count']
          ranks=[]
          for code,r in after['records'].items():
            assert re.fullmatch(r'[0-9A-Z]{6}',code),code
            complete=True
            for i in range(1,5):
              m=r[f'm0{i}']; raw=m['raw']; pct=m['percentile']
              if raw is None:
                complete=False; assert pct is None and m['reason'],(code,i,m)
              else:
                assert math.isfinite(float(raw)) and pct is not None and 0<=float(pct)<=100 and m['basis'],(code,i,m)
                if i==3 and float(raw)<0: assert float(pct)==0.0,(code,m)
            assert (r['composite'] is not None)==complete,(code,'composite')
            assert (r['rank'] is not None)==complete,(code,'rank')
            if r['rank'] is not None: ranks.append(int(r['rank']))
          assert sorted(ranks)==list(range(1,len(ranks)+1))
          print('RECOVERY_CHAIN_EXTREME_PASS',json.dumps({'before':b,'after':a,'dart':dart,'fiscal':fiscal},ensure_ascii=False))
          PY

      - name: Commit recovered remote snapshot on main only
        if: github.event_name == 'workflow_run' || github.ref_name == 'main'
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree --staged evidence/real_quant_snapshot.json
          git pull --rebase origin main
          python scripts/apply_recent_dart_fallback.py \
            --quant evidence/real_quant_snapshot.json \
            --history evidence/quarterly_history.json
          python scripts/apply_fiscal_calendar_recovery.py \
            --quant evidence/real_quant_snapshot.json
          git add evidence/real_quant_snapshot.json
          if git diff --cached --quiet; then
            echo "No recovery change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COV=$(python - <<'PY'
          import json
          d=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          c=d['coverage']; dr=d['recent_dart_fallback']; fr=d['fiscal_calendar_recovery']
          print(f"M01={c['m01_available']} M02={c['m02_available']} M03={c['m03_available']} M04={c['m04_available']} complete={c['complete_count']} dartM01={dr['m01_recovered']} dartM02={dr['m02_recovered']} fiscalM01={fr['m01_recovered']} fiscalM02={fr['m02_recovered']}")
          PY
          )
          git commit -m "Apply KR4 recovery chain: ${COV}"
          git push origin HEAD:main

      - name: Upload recovery proof
        uses: actions/upload-artifact@v4
        with:
          name: KR4_Recovery_Chain_Proof
          path: |
            evidence/real_quant_snapshot.json
            evidence/quarterly_history.json
          if-no-files-found: error
          retention-days: 14
