name: Apply Quarter Code Continuity Fix

on:
  push:
    branches:
      - "feature/quarterly-history-v1"
    paths:
      - ".github/workflows/apply-quarter-code-continuity-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quarterly-history-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply OpenDART period aliases
        run: |
          set -euo pipefail
          python scripts/apply_dart_period_alias_fix.py
          grep -q '"1Q": 1' scripts/collect_quarterly_history.py
          grep -q '"3Q": 3' scripts/collect_quarterly_history.py
          grep -q 'DART_PERIOD_CANONICAL' scripts/collect_real_quant_v3.py
      - name: Run all period adversarial tests
        run: |
          set -euo pipefail
          pip install requests
          python tests/test_quarterly_history.py
          python tests/test_auto_update_pipeline.py
      - name: Commit alias-normalized collectors
        run: |
          set -euo pipefail
          git add scripts/collect_quarterly_history.py scripts/collect_real_quant_v3.py tests/test_quarterly_history.py tests/test_auto_update_pipeline.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize OpenDART 1Q/3Q period aliases"
          git pull --rebase origin feature/quarterly-history-v1
          git push origin HEAD:feature/quarterly-history-v1
