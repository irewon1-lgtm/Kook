name: Apply Quarter Code Continuity Fix

on:
  push:
    branches:
      - "feature/quarterly-history-v1"
    paths:
      - ".github/workflows/apply-quarter-code-continuity-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quarterly-history-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact code fix
        run: |
          set -euo pipefail
          python scripts/apply_quarter_code_continuity_fix.py
          grep -Fq "([A-Z0-9]{2})" scripts/collect_real_quant.py
          grep -q 'assert_contiguous_entries' scripts/collect_quarterly_history.py
          grep -q 'core.assert_contiguous_entries' scripts/collect_quarterly_history_parallel.py
      - name: Run quarter history adversarial tests
        run: |
          set -euo pipefail
          pip install requests
          python tests/test_quarterly_history.py
      - name: Commit fixed collectors
        run: |
          set -euo pipefail
          git add scripts/collect_real_quant.py scripts/collect_quarterly_history.py scripts/collect_quarterly_history_parallel.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix OpenDART Q1/Q3 period parsing and enforce contiguous quarters"
          git pull --rebase origin feature/quarterly-history-v1
          git push origin HEAD:feature/quarterly-history-v1
