name: KR4 Standard Actual Recovery Shadow V2

on:
  push:
    branches:
      - fix/incomplete-267-recovery-v1
    paths:
      - scripts/shadow_standard_actual_recovery_v2.py
      - .github/workflows/shadow-standard-actual-recovery-v2.yml

permissions:
  contents: write

jobs:
  shadow-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incomplete-267-recovery-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q requests pandas lxml
      - name: Run V2 shadow
        working-directory: scripts
        run: python shadow_standard_actual_recovery_v2.py --quant ../evidence/real_quant_snapshot.json --out ../evidence/standard_actual_recovery_v2_shadow.json
      - name: Verify V2 hard gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/standard_actual_recovery_v2_shadow.json').read_text(encoding='utf-8'))
          b=p['coverage_before']; a=p['coverage_after_shadow']
          assert b['complete_count']==2382
          assert b['m01_available']==2504 and b['m02_available']==2409
          assert b['m03_available']==2639 and b['m04_available']==2611
          assert p['source_error_count']==0
          assert a['m01_available']>=b['m01_available']
          assert a['m02_available']>=b['m02_available']
          assert a['m03_available']==b['m03_available']
          assert a['m04_available']==b['m04_available']
          assert a['complete_count']>=b['complete_count']
          assert a['ranked_count']==a['complete_count']
          print('KR4_STANDARD_ACTUAL_SHADOW_V2_GATE=PASS')
          PY
      - name: Commit V2 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/standard_actual_recovery_v2_shadow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record metric-specific actual recovery shadow'
          git push origin HEAD:fix/incomplete-267-recovery-v1
