name: Apply Quarterly History UI Patch

on:
  push:
    branches:
      - "feature/quarterly-history-v1"
    paths:
      - "scripts/apply_quarterly_history_ui_patch.py"
      - ".github/workflows/apply-quarterly-ui-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quarterly-history-v1
          fetch-depth: 0
      - name: Apply exact UI patch
        run: |
          set -euo pipefail
          python scripts/apply_quarterly_history_ui_patch.py
          grep -q 'quarterly_history_panel' app/src/main/java/com/krstock/v3/ui/screens/StockDetailScreen.kt
          grep -q 'QuarterlyHistoryRepository.load' app/src/main/java/com/krstock/v3/ui/screens/StockDetailScreen.kt
      - name: Commit patched screen
        run: |
          set -euo pipefail
          git add app/src/main/java/com/krstock/v3/ui/screens/StockDetailScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire 8-quarter history into stock detail UI"
          git push origin HEAD:feature/quarterly-history-v1
