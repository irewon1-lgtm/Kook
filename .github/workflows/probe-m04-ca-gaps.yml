name: KR4 Probe M04 Corporate Action Gaps

on:
  push:
    branches:
      - fix/incomplete-recovery-v4-main-sync
    paths:
      - scripts/probe_m04_corporate_action_gaps.py
      - .github/workflows/probe-m04-ca-gaps.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incomplete-recovery-v4-main-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Probe four gaps
        run: PYTHONPATH=scripts python scripts/probe_m04_corporate_action_gaps.py
      - name: Gate probe
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/m04_corporate_action_gap_probe.json',encoding='utf-8'))
          assert p['error_count']==0,p['errors']
          assert set(p['records'])=={'006380','008290','046070','082660'}
          for code,row in p['records'].items():
              assert row['suspicious'],(code,row)
          print('M04_CA_GAP_PROBE_PASS')
          PY
      - name: Commit probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/m04_corporate_action_gap_probe.json
          git commit -m 'Record live M04 corporate-action gap probe'
          git pull --rebase origin fix/incomplete-recovery-v4-main-sync
          git push origin HEAD:fix/incomplete-recovery-v4-main-sync
