name: Probe Signing Vault Edge

on:
  push:
    branches:
      - "fix/oidc-signing-gateway-v1"
    paths:
      - ".github/workflows/probe-signing-vault-edge.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request GitHub OIDC token
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kr4-signing-vault" \
            -o "$RUNNER_TEMP/oidc.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'oidc.json')
          token=json.load(open(p,encoding='utf-8')).get('value')
          assert isinstance(token,str) and len(token)>100
          PY

      - name: Probe GET signing route without exposing token or key
        env:
          BASE: https://kr4-signing-vault-5yh3dd.v2.appdeploy.ai
        run: |
          set -euo pipefail
          TOKEN=$(python3 - <<'PY'
          import json,os
          print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'oidc.json'),encoding='utf-8'))['value'])
          PY
          )
          HEALTH=$(curl -sS -o "$RUNNER_TEMP/health.body" -w '%{http_code}' "$BASE/api/_healthcheck")
          NOAUTH=$(curl -sS -o "$RUNNER_TEMP/noauth.body" -w '%{http_code}' "$BASE/api/signing-material")
          BRANCH=$(curl -sS -o "$RUNNER_TEMP/branch.body" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE/api/signing-material")
          echo "health=$HEALTH noauth_get=$NOAUTH branch_oidc_get=$BRANCH"
          test "$HEALTH" = "200"
          test "$NOAUTH" = "401"
          test "$BRANCH" = "401"
          python3 - <<'PY'
          import json,os
          for name in ('noauth','branch'):
              p=os.path.join(os.environ['RUNNER_TEMP'],name+'.body')
              obj=json.load(open(p,encoding='utf-8'))
              assert isinstance(obj,dict) and 'error' in obj,(name,obj.keys())
          print('GET_EDGE_REACHES_VAULT_PASS')
          PY
