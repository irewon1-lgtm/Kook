name: Probe Existing Netlify CI Auth Contract

on:
  push:
    branches:
      - "fix/oidc-signing-gateway-v1"
    paths:
      - ".github/workflows/probe-signing-vault-edge.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request GitHub OIDC token
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kr4-signing-vault" \
            -o "$RUNNER_TEMP/oidc.json"
          python3 - <<'PY'
          import json,os
          token=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'oidc.json'),encoding='utf-8')).get('value')
          assert isinstance(token,str) and len(token)>100
          PY

      - name: Read only public error contract
        env:
          BASE: https://ai-ranker-family-live.netlify.app/api/ci-bootstrap-token
        run: |
          set -euo pipefail
          TOKEN=$(python3 - <<'PY'
          import json,os
          print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'oidc.json'),encoding='utf-8'))['value'])
          PY
          )
          printf '{"token":"%s"}' "$TOKEN" > "$RUNNER_TEMP/token-body.json"
          probe() {
            NAME="$1"; shift
            BODY="$RUNNER_TEMP/${NAME}.body"
            STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' "$@")
            python3 - "$NAME" "$STATUS" "$BODY" <<'PY'
          import json,sys
          name,status,path=sys.argv[1:]
          try:
              obj=json.load(open(path,encoding='utf-8'))
              if status != '200' and isinstance(obj,dict):
                  err=obj.get('error')
                  if isinstance(err,str) and len(err)<200:
                      print(f'{name} status={status} error={err}')
                  else:
                      print(f'{name} status={status} keys={sorted(obj.keys())}')
              else:
                  print(f'{name} status={status} keys={sorted(obj.keys()) if isinstance(obj,dict) else type(obj).__name__}')
          except Exception:
              print(f'{name} status={status} non_json')
          PY
          }
          probe post_noauth -X POST -H 'Content-Type: application/json' -d '{}' "$BASE"
          probe post_oidc_header -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -d '{}' "$BASE"
          probe post_oidc_body -X POST -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/token-body.json" "$BASE"
