name: Android Build & APK CI

on:
  push:
    branches: [ "main", "refactor-kr-stock-v3-4metrics" ]
  pull_request:
    branches: [ "main", "refactor-kr-stock-v3-4metrics" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Python Reference Engine Tests
        run: |
          python3 tests/run_all.py evidence/clean_pass_results.json
          python3 tests/run_stress.py

      - name: Build Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not present or local execution environment."
          fi

      - name: Copy Built APK to dist/
        run: |
          mkdir -p dist
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/KR_Stock_V3_Debug.apk
            echo "Copied APK to dist/KR_Stock_V3_Debug.apk"
          else
            echo "APK build file not found locally, will be uploaded in CI pipeline."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KR_Stock_V3_Debug_APK
          path: |
            dist/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
