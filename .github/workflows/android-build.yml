name: KR4 c20210 Final Evidence Attachment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr4-c20210-final-evidence
  cancel-in-progress: false

jobs:
  attach-verified-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: kr4-app-c20210
      EVIDENCE_DIR: docs/releases/kr4-app-c20210-final-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed payload and immutable APK identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          manifest = json.loads((root / 'attachment-manifest.json').read_text())
          for name, expected in manifest.items():
              assert Path(name).name == name
              raw = (root / name).read_bytes()
              assert len(raw) == expected['bytes'], name
              assert hashlib.sha256(raw).hexdigest() == expected['sha256'], name
          original = json.loads((root / 'original-release-assets.json').read_text())
          release = json.loads(subprocess.check_output(['gh', 'api', 'repos/irewon1-lgtm/Kook/releases/tags/kr4-app-c20210']))
          current = {a['name']: {k: a.get(k) for k in ['id', 'size', 'digest', 'updated_at']} for a in release['assets']}
          for name, expected in original.items():
              assert current[name] == expected, name
          base = 'https://github.com/irewon1-lgtm/Kook/releases/download/kr4-app-c20210/'
          update = json.load(urllib.request.urlopen(base + 'update.json', timeout=60))
          assert update['versionCode'] == 20210 and update['versionName'] == '4.3.210'
          assert update['commit'] == '8b1b45671072636dff59f1ced48aa311204fe2ff'
          assert update['signingCertificateSha256'] == '1070e82beee574cd29ffd2dc3e693fd7f7862374f16d1606567db303ab152477'
          apk = urllib.request.urlopen(base + 'KR4.apk', timeout=60).read()
          assert hashlib.sha256(apk).hexdigest() == update['sha256'] == '579d25b95a02e5795c31a05526c4ef4bbcdbddb1f0334b843828b7b40a1c0017'
          assert set(manifest).isdisjoint(original)
          print('PASS: all', len(manifest), 'attachments; original release and APK unchanged')
          PY
      - name: Attach final review and original Android evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          manifest = json.loads((root / 'attachment-manifest.json').read_text())
          subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'], '--repo', 'irewon1-lgtm/Kook', *[str(root / name) for name in sorted(manifest)]], check=True)
          PY
      - name: Verify all original release assets remain unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          original = json.loads((root / 'original-release-assets.json').read_text())
          attachments = json.loads((root / 'attachment-manifest.json').read_text())
          release = json.loads(subprocess.check_output(['gh', 'api', 'repos/irewon1-lgtm/Kook/releases/tags/kr4-app-c20210']))
          assets = {a['name']: a for a in release['assets']}
          for name, expected in original.items():
              assert {k: assets[name].get(k) for k in ['id', 'size', 'digest', 'updated_at']} == expected, name
          for name, expected in attachments.items():
              assert assets[name]['size'] == expected['bytes'], name
              assert assets[name]['digest'] == 'sha256:' + expected['sha256'], name
          print('PASS: original', len(original), 'assets unchanged; final', len(attachments), 'attachment hashes match')
          PY
