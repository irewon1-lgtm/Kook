name: KR4 KOSPI Registration CleanPass

on:
  push:
    branches:
      - "register-real-kospi-master"
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  extreme-cleanpass:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate committed official KOSPI master
        run: |
          set -euo pipefail
          test -s evidence/kospi_master_snapshot.json
          test -s app/src/main/java/com/krstock/v3/data/generated/GeneratedKospiMaster.kt
          python3 -c "import json,re; d=json.load(open('evidence/kospi_master_snapshot.json',encoding='utf-8')); assert d['market']=='KOSPI'; assert 700<=d['issuer_count']<=1200; assert d['issuer_count']==d['unique_issue_codes']; assert d['six_character_krx_codes'] is True; print('KOSPI_SNAPSHOT_OK',d['issuer_count'],d['snapshot_date_kst'],d['sha256_normalized_master'])"
          grep -q 'const val issuerCount: Int = 832' app/src/main/java/com/krstock/v3/data/generated/GeneratedKospiMaster.kt
          grep -q 'KospiIssuer(code = "005930", name = "삼성전자"' app/src/main/java/com/krstock/v3/data/generated/GeneratedKospiMaster.kt
          grep -q 'KospiIssuer(code = "000660", name = "SK하이닉스"' app/src/main/java/com/krstock/v3/data/generated/GeneratedKospiMaster.kt
          grep -q 'KospiIssuer(code = "0220W0", name = "한화머시너리앤서비스홀딩스"' app/src/main/java/com/krstock/v3/data/generated/GeneratedKospiMaster.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Python reference-engine CLEAN tests
        run: |
          set -euo pipefail
          python3 tests/run_all.py evidence/clean_pass_results.json
          python3 tests/run_stress.py

      - name: Android repository regression tests
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Real Android emulator install and UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Hard verify APK exists and is non-empty
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          mkdir -p dist evidence/ci
          cp "$APK" dist/KR4_KOSPI_832_Registered_debug.apk
          sha256sum "$APK" | tee evidence/ci/APK_SHA256.txt
          stat --printf='APK_BYTES=%s\n' "$APK" | tee evidence/ci/APK_SIZE.txt

      - name: Guard against fake success
        run: |
          set -euo pipefail
          test -s dist/KR4_KOSPI_832_Registered_debug.apk
          test -s evidence/ci/APK_SHA256.txt
          test -s evidence/ci/APK_SIZE.txt
          grep -q 'DataStatus.REGISTERED' app/src/main/java/com/krstock/v3/data/repository/StockRepository.kt
          grep -q '4지표 실데이터는 아직 미수집' app/src/main/java/com/krstock/v3/data/repository/StockRepository.kt
          ! grep -R "news.example.com" app/src/main || exit 1
          ! grep -R "mockStocks.first" app/src/main || exit 1
          ! grep -R 'market = "KOSDAQ"' app/src/main/java/com/krstock/v3/data/repository || exit 1

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: KR4_KOSPI_832_Registered_APK
          path: |
            dist/KR4_KOSPI_832_Registered_debug.apk
            evidence/ci/APK_SHA256.txt
            evidence/ci/APK_SIZE.txt
            evidence/kospi_master_snapshot.json
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14
