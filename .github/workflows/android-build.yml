name: KR4 Stage4567 Extreme CleanPass

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/stage4567_trigger_v2"

permissions:
  contents: write
  id-token: write

concurrency:
  group: kr4-stage4567-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage4567-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Materialize approved Stage4567 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/stage4567_payload.part* | base64 -d > /tmp/stage4567_payload.tgz
          echo '7683b880ef72c26127f15e8951042f28285d861e6e3b9268196c6522953c943d  /tmp/stage4567_payload.tgz' | sha256sum -c -
          tar -xzf /tmp/stage4567_payload.tgz
          test -x scripts/stage4567_ci.sh
          echo STAGE4567_APPROVED_PATCH_MATERIALIZED

      - name: Replace prevalence guess with structural financial-safety gate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patch_stage4567_gate.py
          bash -n scripts/stage4567_ci.sh

      - name: Assert approved execution context
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          echo "EXECUTION_CONTEXT_PASS sha=$GITHUB_SHA event=${{ github.event_name }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests pandas lxml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stage4567 pre-emulator CLEAN PASS
        run: bash scripts/stage4567_ci.sh pre

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 14 end-to-end simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Diagnose post-stage JSON inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          s = Path('scripts/stage4567_ci.sh').read_text(encoding='utf-8')
          start = s.find('post)')
          if start < 0:
              raise SystemExit('post case not found')
          end = s.find('\n    ;;', start)
          if end < 0:
              end = min(len(s), start + 20000)
          block = s[start:end]
          print('POST_SECTION_BEGIN')
          print(block)
          print('POST_SECTION_END')
          refs = sorted(set(re.findall(r'''["']([^"']+\.json)["']''', block)))
          print('POST_JSON_LITERAL_REFS', refs)
          candidates = set(refs)
          for root in (Path('evidence'), Path('dist'), Path('/tmp')):
              if root.exists():
                  for p in root.rglob('*.json'):
                      candidates.add(str(p))
          for raw in sorted(candidates):
              p = Path(raw)
              if not p.exists() or not p.is_file():
                  print('JSON_INPUT', raw, 'MISSING')
                  continue
              size = p.stat().st_size
              status = 'VALID'
              err = ''
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  status = 'INVALID'
                  err = f'{type(exc).__name__}:{exc}'
              print('JSON_INPUT', raw, 'size=', size, 'status=', status, err)
          PY

      - name: Stable-sign, promote validated code/data, and stage release proof
        run: bash scripts/stage4567_ci.sh post

      - name: Upload execution proof before release
        uses: actions/upload-artifact@v4
        with:
          name: KR4_Stage4567_Release_Proof
          path: |
            dist/KR4.apk
            dist/update.json
            dist/APK_SIGNING_CERT.txt
            evidence/ci/stage4567/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14

      - name: Publish and verify GitHub Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage4567_ci.sh publish
