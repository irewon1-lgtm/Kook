name: KR4 AutoUpdate Extreme CleanPass

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  extreme-cleanpass:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_STABLE_CERT_SHA256: 1070e82beee574cd29ffd2dc3e693fd7f7862374f16d1606567db303ab152477

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect app source change
        id: app_scope
        run: |
          set -euo pipefail
          APP_CHANGED=true
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- app/; then
            APP_CHANGED=false
          fi
          echo "changed=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "APP_SOURCE_CHANGED=$APP_CHANGED"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python collector dependency
        run: pip install requests

      - name: Validate masters and current committed snapshot without frozen dates
        run: |
          set -euo pipefail
          test -s evidence/kospi_master_snapshot.json
          test -s evidence/kosdaq_master_snapshot.json
          test -s evidence/real_quant_snapshot.json
          test -s evidence/quarterly_history.json
          python3 - <<'PY'
          import json, math, re
          from datetime import date
          k = json.load(open('evidence/kospi_master_snapshot.json', encoding='utf-8'))
          q = json.load(open('evidence/kosdaq_master_snapshot.json', encoding='utf-8'))
          d = json.load(open('evidence/real_quant_snapshot.json', encoding='utf-8'))
          assert k['issuer_count'] + q['issuer_count'] == d['universe_count'] == len(d['records']) == 2649
          snap = date.fromisoformat(d['snapshot_date_kst'])
          price = date.fromisoformat(d['price_cutoff_date_kst'])
          assert price <= snap and (snap - price).days <= 10, (snap, price)
          c = d['coverage']
          floors = {'m01_available': 2400, 'm02_available': 2300, 'm03_available': 1600, 'm04_available': 2550, 'complete_count': 1380}
          for key, floor in floors.items():
              assert int(c[key]) >= floor, (key, c[key], floor)
          assert c['ranked_count'] == c['complete_count']
          ranks = []
          for code, row in d['records'].items():
              assert re.fullmatch(r'[0-9A-Z]{6}', code)
              metrics = [row[f'm0{i}'] for i in range(1, 5)]
              complete = True
              for metric in metrics:
                  if metric['raw'] is None:
                      complete = False
                      assert metric['percentile'] is None and metric['reason']
                  else:
                      assert math.isfinite(float(metric['raw']))
                      assert metric['percentile'] is not None and 0 <= float(metric['percentile']) <= 100
                      assert metric['basis']
              assert (row['composite'] is not None) == complete
              assert (row['rank'] is not None) == complete
              if row['rank'] is not None:
                  ranks.append(int(row['rank']))
          assert sorted(ranks) == list(range(1, len(ranks) + 1))
          assert d['records']['005930']['name'] == '삼성전자'
          print('CURRENT_SNAPSHOT_VALIDATED', snap, price, json.dumps(c, ensure_ascii=False))
          PY

      - name: Auto-update and quarterly-history adversarial logic tests
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 tests/test_auto_update_pipeline.py
          python3 tests/test_quarterly_history.py

      - name: Live news/disclosure evidence source probe
        if: steps.app_scope.outputs.changed == 'true'
        run: python3 scripts/probe_context_sources.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Python reference and combination Extreme simulations
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 tests/run_all.py evidence/clean_pass_results.json
          python3 tests/run_stress.py
          python3 tests/run_combo_rank_stress.py evidence/combo_rank_stress_results.json
          python3 - <<'PY'
          import json
          d = json.load(open('evidence/combo_rank_stress_results.json', encoding='utf-8'))
          assert d['status'] == 'PASS'
          assert d['all_nonempty_combinations_tested'] == 15
          assert d['ten_thousand_toggle_simulation_pass'] is True
          assert d['all_four_reproduces_committed_rank'] is True
          assert d['selected_complete_filter_checks'] == 2649 * 15
          print('COMBO_RANK_EXTREME_PASS', d['all_nonempty_combinations_tested'], d['selected_complete_filter_checks'])
          PY

      - name: Android 2649-stock regression tests
        if: steps.app_scope.outputs.changed == 'true'
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        if: steps.app_scope.outputs.changed == 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM for emulator
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 14 end-to-end simulation
        if: steps.app_scope.outputs.changed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Hard verify APK and automatic-update fail-safes
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist evidence/ci
          cp "$APK" dist/KR4_AUTOUPDATE_Extreme_CleanPass_debug.apk
          sha256sum "$APK" | tee evidence/ci/APK_SHA256.txt
          stat --printf='APK_BYTES=%s\n' "$APK" | tee evidence/ci/APK_SIZE.txt
          grep -q 'applicationId = "com.krstock.v3"' app/build.gradle.kts
          grep -q 'AppAutoUpdater.checkAndDownload' app/src/main/java/com/krstock/v3/MainActivity.kt
          grep -q 'PeriodicWorkRequestBuilder<AppUpdateWorker>' app/src/main/java/com/krstock/v3/KR4Application.kt
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'FileProvider' app/src/main/AndroidManifest.xml
          grep -q 'releases/latest/download/update.json' app/src/main/java/com/krstock/v3/update/AppAutoUpdater.kt
          grep -q 'signerDigests(installed) == signerDigests(archive)' app/src/main/java/com/krstock/v3/update/AppAutoUpdater.kt
          grep -q 'sha256(apk) != info.sha256' app/src/main/java/com/krstock/v3/update/AppAutoUpdater.kt
          grep -q 'id-token: write' .github/workflows/android-build.yml
          grep -q 'kr4-signing-vault-5yh3dd.v2.appdeploy.ai' .github/workflows/android-build.yml
          grep -q "$EXPECTED_STABLE_CERT_SHA256" .github/workflows/android-build.yml

      - name: Upload verified APK and evidence
        if: steps.app_scope.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KR4_AUTOUPDATE_Extreme_CleanPass
          path: |
            dist/KR4_AUTOUPDATE_Extreme_CleanPass_debug.apk
            evidence/ci/APK_SHA256.txt
            evidence/ci/APK_SIZE.txt
            evidence/combo_rank_stress_results.json
            evidence/real_quant_snapshot.json
            evidence/quarterly_history.json
            evidence/clean_pass_results.json
            evidence/stress_results.json
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14

      - name: Detect signed app-release eligibility
        id: release_gate
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          RELEASE_READY=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              RELEASE_READY=true
            elif git rev-parse HEAD^ >/dev/null 2>&1 && ! git diff --quiet HEAD^ HEAD -- app/ .github/workflows/android-build.yml; then
              RELEASE_READY=true
            fi
          fi
          echo "app_changed=$RELEASE_READY" >> "$GITHUB_OUTPUT"
          echo "ready=$RELEASE_READY" >> "$GITHUB_OUTPUT"
          echo "RELEASE_READY=$RELEASE_READY"

      - name: Request GitHub OIDC token with toolkit
        if: steps.release_gate.outputs.ready == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const token = await core.getIDToken('kr4-signing-vault')
            if (!token || token.length < 100) throw new Error('OIDC token missing or too short')
            core.setSecret(token)
            const p = `${process.env.RUNNER_TEMP}/kr4-oidc-token.txt`
            fs.writeFileSync(p, token, { mode: 0o600 })
            core.info(`OIDC_TOOLKIT_PASS length=${token.length}`)

      - name: Prepare original KR4 stable signing identity
        if: steps.release_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test -s "$RUNNER_TEMP/kr4-oidc-token.txt"
          OIDC_TOKEN=$(cat "$RUNNER_TEMP/kr4-oidc-token.txt")
          test "${#OIDC_TOKEN}" -gt 100

          OIDC_TOKEN="$OIDC_TOKEN" python3 - <<'PYCLAIMS'
          import base64, json, os
          token=os.environ['OIDC_TOKEN']
          parts=token.split('.')
          assert len(parts)==3
          p=parts[1].replace('-','+').replace('_','/')
          p += '='*((4-len(p)%4)%4)
          claims=json.loads(base64.b64decode(p).decode('utf-8'))
          safe={k:claims.get(k) for k in ('iss','aud','sub','repository','repository_id','repository_owner','repository_owner_id','ref','event_name','workflow','workflow_ref','job_workflow_ref')}
          print('OIDC_SAFE_CLAIMS', json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PYCLAIMS

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/kr4-transport-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/kr4-transport-private.pem" \
            -pubout -outform DER -out "$RUNNER_TEMP/kr4-transport-public.der"
          TRANSPORT_KEY=$(base64 -w0 "$RUNNER_TEMP/kr4-transport-public.der" | tr '+/' '-_' | tr -d '=')

          RELAY_URL_FILE="$RUNNER_TEMP/kr4-relay-url.txt"
          OIDC_TOKEN="$OIDC_TOKEN" TRANSPORT_KEY="$TRANSPORT_KEY" RELAY_URL_FILE="$RELAY_URL_FILE" python3 - <<'PYURL'
          import os, urllib.parse
          fragment=urllib.parse.urlencode(
              {'relay_token':os.environ['OIDC_TOKEN'], 'transport_key':os.environ['TRANSPORT_KEY']},
              quote_via=urllib.parse.quote,
          )
          url='https://kr4-signing-vault-5yh3dd.v2.appdeploy.ai/#'+fragment
          with open(os.environ['RELAY_URL_FILE'],'w',encoding='utf-8') as f:
              f.write(url)
          os.chmod(os.environ['RELAY_URL_FILE'],0o600)
          print('SIGNING_BROWSER_RELAY_URL_READY')
          PYURL

          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          RELAY_URL=$(cat "$RELAY_URL_FILE")
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=15000 --dump-dom "$RELAY_URL" > "$RUNNER_TEMP/kr4-relay.html"
          rm -f "$RELAY_URL_FILE"

          RELAY_HTML="$RUNNER_TEMP/kr4-relay.html" RELAY_JSON="$RUNNER_TEMP/kr4-encrypted-signing.json" python3 - <<'PYRELAY'
          import html as html_lib, json, os, re
          src=open(os.environ['RELAY_HTML'],encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre[^>]*id=["\']relay-output["\'][^>]*>(.*?)</pre>',src,re.I|re.S)
          assert m, 'relay_output_missing'
          text=re.sub(r'<[^>]+>','',m.group(1))
          text=html_lib.unescape(text).strip()
          assert text and text != 'WORKING', 'relay_not_completed'
          doc=json.loads(text)
          assert not doc.get('error'), doc
          for key in ('algorithm','ciphertextChunks','repository','ref'):
              assert key in doc, (key, doc.keys())
          assert doc['algorithm']=='RSA-OAEP-SHA256'
          assert doc['repository']=='irewon1-lgtm/Kook'
          assert doc['ref']=='refs/heads/main'
          chunks=doc['ciphertextChunks']
          assert isinstance(chunks,list) and chunks and all(isinstance(x,str) and x for x in chunks)
          with open(os.environ['RELAY_JSON'],'w',encoding='utf-8') as f:
              json.dump(doc,f,separators=(',',':'))
              f.write('\n')
          print('SIGNING_BROWSER_RELAY_PASS', len(chunks))
          PYRELAY
          rm -f "$RUNNER_TEMP/kr4-relay.html"
          test -s "$RUNNER_TEMP/kr4-encrypted-signing.json"

          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'kr4-encrypted-signing.json')
          root = json.load(open(path, encoding='utf-8'))
          assert root.get('algorithm') == 'RSA-OAEP-SHA256'
          assert root.get('repository') == 'irewon1-lgtm/Kook'
          assert root.get('ref') == 'refs/heads/main'
          chunks = root.get('ciphertextChunks')
          assert isinstance(chunks, list) and chunks and all(isinstance(x, str) and x for x in chunks)
          out = os.path.join(os.environ['RUNNER_TEMP'], 'kr4-encrypted-chunks.txt')
          with open(out, 'w', encoding='utf-8') as f:
              for item in chunks:
                  f.write(item + '\n')
          PY

          : > "$RUNNER_TEMP/kr4-signing-bundle.txt"
          INDEX=0
          while IFS= read -r CHUNK; do
            printf '%s' "$CHUNK" | base64 -d > "$RUNNER_TEMP/kr4-chunk-${INDEX}.bin"
            openssl pkeyutl -decrypt \
              -inkey "$RUNNER_TEMP/kr4-transport-private.pem" \
              -in "$RUNNER_TEMP/kr4-chunk-${INDEX}.bin" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              >> "$RUNNER_TEMP/kr4-signing-bundle.txt"
            INDEX=$((INDEX + 1))
          done < "$RUNNER_TEMP/kr4-encrypted-chunks.txt"
          test "$INDEX" -gt 0

          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          rt=os.environ['RUNNER_TEMP']
          path=os.path.join(rt,'kr4-signing-bundle.txt')
          raw=open(path,encoding='utf-8').read().strip()
          assert len(raw)>100
          doc=json.loads(base64.b64decode(raw).decode('utf-8'))
          for key in ('keystore_b64','store_password','alias','key_password'):
              value=doc.get(key)
              assert isinstance(value,str) and value and '\n' not in value and '\r' not in value, key
          jks=os.path.join(rt,'kr4-release.jks')
          open(jks,'wb').write(base64.b64decode(doc['keystore_b64']))
          os.chmod(jks,0o600)
          cert=subprocess.check_output([
              'keytool','-exportcert','-keystore',jks,'-alias',doc['alias'],'-storepass',doc['store_password']
          ],stderr=subprocess.DEVNULL)
          sha=hashlib.sha256(cert).hexdigest()
          expected=os.environ['EXPECTED_STABLE_CERT_SHA256']
          assert sha==expected,(sha,expected)
          print(f"::add-mask::{doc['store_password']}")
          print(f"::add-mask::{doc['key_password']}")
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              out.write(f"KR4_KEYSTORE_FILE={jks}\n")
              out.write(f"KR4_KEYSTORE_PASSWORD={doc['store_password']}\n")
              out.write(f"KR4_KEY_ALIAS={doc['alias']}\n")
              out.write(f"KR4_KEY_PASSWORD={doc['key_password']}\n")
              out.write(f"KR4_SIGNING_CERT_SHA256={sha}\n")
          print('STABLE_SIGNING_CERT_PASS',sha)
          PY

          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          [[ "$LATEST_TAG" =~ ^kr4-app-c([0-9]+)$ ]]
          VERSION_CODE=$((10#${BASH_REMATCH[1]} + 1))
          while gh release view "kr4-app-c${VERSION_CODE}" >/dev/null 2>&1; do VERSION_CODE=$((VERSION_CODE + 1)); done
          VERSION_NAME="4.3.$((VERSION_CODE - 20000))"
          echo "KR4_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "KR4_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          rm -f \
            "$RUNNER_TEMP/kr4-oidc-token.txt" \
            "$RUNNER_TEMP/kr4-encrypted-signing.json" \
            "$RUNNER_TEMP/kr4-encrypted-chunks.txt" \
            "$RUNNER_TEMP/kr4-signing-bundle.txt" \
            "$RUNNER_TEMP/kr4-transport-private.pem" \
            "$RUNNER_TEMP/kr4-transport-public.der" \
            "$RUNNER_TEMP"/kr4-chunk-*.bin
          echo "STABLE_SIGNING_IDENTITY_READY cert_sha256=$EXPECTED_STABLE_CERT_SHA256 version=$VERSION_NAME latest=$LATEST_TAG"

      - name: Build and verify stable signed Release APK
        if: steps.release_gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/KR4.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs dist/KR4.apk | tee dist/APK_SIGNING_CERT.txt
          ACTUAL_APK_CERT_SHA=$(python3 - <<'PYAPK'
          import re
          text=open('dist/APK_SIGNING_CERT.txt',encoding='utf-8',errors='replace').read()
          m=re.search(r'(?im)certificate SHA-256 digest:\s*([0-9a-f:]{64,95})\s*$', text)
          assert m, 'apk_certificate_sha256_missing'
          print(m.group(1).replace(':','').lower())
          PYAPK
          )
          test "$ACTUAL_APK_CERT_SHA" = "$EXPECTED_STABLE_CERT_SHA256"
          BADGING=$("$AAPT" dump badging dist/KR4.apk | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.krstock.v3'"
          echo "$BADGING" | grep -q "versionCode='${KR4_VERSION_CODE}'"
          echo "$BADGING" | grep -q "versionName='${KR4_VERSION_NAME}'"
          echo "STABLE_RELEASE_APK_PASS bytes=$(stat -c%s dist/KR4.apk) cert=$ACTUAL_APK_CERT_SHA"

      - name: Generate cryptographic latest-update manifest
        if: steps.release_gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SHA256=$(sha256sum dist/KR4.apk | awk '{print $1}')
          export SHA256
          python3 - <<'PY'
          import json, os
          doc = {
              'versionCode': int(os.environ['KR4_VERSION_CODE']),
              'versionName': os.environ['KR4_VERSION_NAME'],
              'apkUrl': 'https://github.com/irewon1-lgtm/Kook/releases/latest/download/KR4.apk',
              'sha256': os.environ['SHA256'],
              'mandatory': False,
              'notes': '검증된 국내주식 앱 UI·기능 업데이트',
              'commit': os.environ['GITHUB_SHA'],
              'signingCertificateSha256': os.environ['KR4_SIGNING_CERT_SHA256'],
          }
          with open('dist/update.json', 'w', encoding='utf-8') as f:
              json.dump(doc, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps({k: v for k, v in doc.items() if k != 'apkUrl'}, ensure_ascii=False))
          PY
          grep -q '"sha256"' dist/update.json
          grep -q '"versionCode"' dist/update.json
          grep -q '"signingCertificateSha256"' dist/update.json

      - name: Publish immutable signed APK as GitHub latest release
        if: steps.release_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="kr4-app-c${KR4_VERSION_CODE}"
          TITLE="KR4 ${KR4_VERSION_NAME}"
          NOTES="Stage4~7 UI 반영 및 기존 KR4 고정서명 검증 완료. commit ${GITHUB_SHA}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KR4.apk dist/update.json dist/APK_SIGNING_CERT.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" \
              dist/KR4.apk \
              dist/update.json \
              dist/APK_SIGNING_CERT.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$TAG"
          rm -rf "$RUNNER_TEMP/kr4-release-verify"
          mkdir -p "$RUNNER_TEMP/kr4-release-verify"
          gh release download "$TAG" -p KR4.apk -p update.json -p APK_SIGNING_CERT.txt -D "$RUNNER_TEMP/kr4-release-verify"
          test "$(sha256sum dist/KR4.apk | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/kr4-release-verify/KR4.apk" | awk '{print $1}')"
          cmp -s dist/update.json "$RUNNER_TEMP/kr4-release-verify/update.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'kr4-release-verify','update.json')
          d=json.load(open(p,encoding='utf-8'))
          assert d['commit']==os.environ['GITHUB_SHA']
          assert d['versionCode']==int(os.environ['KR4_VERSION_CODE'])
          assert d['versionName']==os.environ['KR4_VERSION_NAME']
          assert d['signingCertificateSha256']==os.environ['EXPECTED_STABLE_CERT_SHA256']
          print('LATEST_RELEASE_REDOWNLOAD_PASS', d['versionName'], d['versionCode'])
          PY
          gh release view "$TAG" --json tagName,name,url

      - name: Signed release status
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ "${{ steps.release_gate.outputs.app_changed }}" != "true" ]; then
            echo "No app/workflow code change: APK release intentionally skipped."
          else
            test -s dist/KR4.apk
            test -s dist/update.json
            echo "Stable signed APK release published and detectable by installed KR4 apps."
          fi
