name: KR4 Stage4567 Direct Stable Release

on:
  push:
    branches: [main]
    paths:
      - ".github/stage4567_trigger_v2"

permissions:
  contents: write
  id-token: write

concurrency:
  group: kr4-stage4567-direct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage4567-direct-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPECTED_STABLE_CERT_SHA256: 1070e82beee574cd29ffd2dc3e693fd7f7862374f16d1606567db303ab152477
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preserve direct-release helper and materialize fixed payload
        shell: bash
        run: |
          set -euo pipefail
          cp .github/stage4567_direct_release.sh /tmp/stage4567_direct_release.sh
          chmod +x /tmp/stage4567_direct_release.sh
          cat .github/stage4567_payload.part* | base64 -d > /tmp/stage4567_payload.tgz
          echo '7683b880ef72c26127f15e8951042f28285d861e6e3b9268196c6522953c943d  /tmp/stage4567_payload.tgz' | sha256sum -c -
          tar -xzf /tmp/stage4567_payload.tgz
          test -x scripts/stage4567_ci.sh
          python3 .github/patch_stage4567_gate.py
          bash -n scripts/stage4567_ci.sh
          bash -n /tmp/stage4567_direct_release.sh
          echo DIRECT_BOOTSTRAP_PASS

      - name: Assert execution context
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "${{ github.event_name }}" = 'push'
          echo "DIRECT_CONTEXT_PASS sha=$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests pandas lxml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stage4567 pre-emulator CLEAN PASS
        run: bash scripts/stage4567_ci.sh pre

      - name: Prepare validated promotion data
        run: /tmp/stage4567_direct_release.sh prepare

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 14 end-to-end simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Obtain and verify original stable signing identity
        run: /tmp/stage4567_direct_release.sh sign

      - name: Build and verify stable signed Release APK
        run: /tmp/stage4567_direct_release.sh build

      - name: Promote validated code and data to main
        run: /tmp/stage4567_direct_release.sh promote

      - name: Generate exact update manifest
        run: /tmp/stage4567_direct_release.sh manifest

      - name: Upload release proof before public release
        uses: actions/upload-artifact@v4
        with:
          name: KR4_Stage4567_Direct_Release_Proof
          path: |
            dist/KR4.apk
            dist/update.json
            dist/APK_SIGNING_CERT.txt
            evidence/ci/stage4567/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14

      - name: Publish and redownload-verify Latest Release
        run: /tmp/stage4567_direct_release.sh publish
