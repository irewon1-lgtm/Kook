name: KR4 Swipe+MultiRank Extreme CleanPass

on:
  push:
    branches:
      - "connect-dart-price-data"
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  extreme-cleanpass:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate market masters and committed real-data snapshot
        run: |
          set -euo pipefail
          test -s evidence/kospi_master_snapshot.json
          test -s evidence/kosdaq_master_snapshot.json
          test -s evidence/real_quant_snapshot.json
          test -s app/src/main/java/com/krstock/v3/data/generated/GeneratedRealQuantSnapshot.kt
          python3 - <<'PY'
          import hashlib, json, math, pathlib, re
          k=json.load(open('evidence/kospi_master_snapshot.json',encoding='utf-8'))
          q=json.load(open('evidence/kosdaq_master_snapshot.json',encoding='utf-8'))
          d=json.load(open('evidence/real_quant_snapshot.json',encoding='utf-8'))
          assert k['issuer_count']==832 and q['issuer_count']==1817
          assert d['universe_count']==2649 and len(d['records'])==2649
          assert d['snapshot_date_kst']=='2026-09-15'
          assert d['price_cutoff_date_kst']=='2026-09-14'
          c=d['coverage']
          # Regression floors, not frozen exact counts. Better source coverage must be allowed.
          floors={'m01_available':2400,'m02_available':2300,'m03_available':1677,'m04_available':2550,'complete_count':1462}
          for key,floor in floors.items():
              assert int(c[key])>=floor,(key,c[key],floor,c)
          assert c['ranked_count']==c['complete_count'],c
          kt=pathlib.Path('app/src/main/java/com/krstock/v3/data/generated/GeneratedRealQuantSnapshot.kt')
          kt_sha=hashlib.sha256(kt.read_bytes()).hexdigest()
          assert kt_sha==d['generated_kotlin_sha256'],(kt_sha,d['generated_kotlin_sha256'])
          ranks=[]
          for code,r in d['records'].items():
              assert re.fullmatch(r'[0-9A-Z]{6}',code),code
              metrics=[r[f'm0{i}'] for i in range(1,5)]
              complete=True
              for m in metrics:
                  if m['raw'] is None:
                      complete=False
                      assert m['percentile'] is None and m['reason']
                  else:
                      assert math.isfinite(float(m['raw']))
                      assert m['percentile'] is not None and 0<=float(m['percentile'])<=100
                      assert m['basis']
              if complete:
                  assert r['composite'] is not None and r['rank'] is not None
                  ranks.append(int(r['rank']))
              else:
                  assert r['composite'] is None and r['rank'] is None
          assert sorted(ranks)==list(range(1,int(c['ranked_count'])+1))
          assert d['records']['005930']['name']=='삼성전자'
          assert d['records']['000250']['name']=='삼천당제약'
          print('REAL_SNAPSHOT_VALIDATED',json.dumps(c,ensure_ascii=False))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Python reference and combination Extreme simulations
        run: |
          set -euo pipefail
          python3 tests/run_all.py evidence/clean_pass_results.json
          python3 tests/run_stress.py
          python3 tests/run_combo_rank_stress.py evidence/combo_rank_stress_results.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/combo_rank_stress_results.json',encoding='utf-8'))
          assert d['status']=='PASS'
          assert d['all_nonempty_combinations_tested']==15
          assert d['ten_thousand_toggle_simulation_pass'] is True
          assert d['all_four_reproduces_committed_rank'] is True
          assert d['selected_complete_filter_checks']==2649*15
          print('COMBO_RANK_EXTREME_PASS',d['all_nonempty_combinations_tested'],d['selected_complete_filter_checks'])
          PY

      - name: Android 2649-stock and dynamic-ranking extreme regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Real Android swipe and multi-ranking end-to-end simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Hard verify APK and requested features
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist evidence/ci
          cp "$APK" dist/KR4_PER_UI_Extreme_CleanPass_debug.apk
          sha256sum "$APK" | tee evidence/ci/APK_SHA256.txt
          stat --printf='APK_BYTES=%s\n' "$APK" | tee evidence/ci/APK_SIZE.txt
          grep -q 'HorizontalPager' app/src/main/java/com/krstock/v3/MainActivity.kt
          grep -q 'HorizontalPager' app/src/main/java/com/krstock/v3/ui/screens/StockDetailScreen.kt
          grep -q 'DynamicRankingEngine.rank' app/src/main/java/com/krstock/v3/ui/screens/StockListScreen.kt
          grep -q 'metric_toggle_M01' app/src/main/java/com/krstock/v3/ui/screens/StockListScreen.kt
          grep -q 'selected_metrics_complete_only' app/src/main/java/com/krstock/v3/ui/screens/StockListScreen.kt
          grep -q 'displayRank = dynamic?.rank' app/src/main/java/com/krstock/v3/ui/screens/StockListScreen.kt
          grep -q 'selectedMetricIds.size == 1' app/src/main/java/com/krstock/v3/ui/screens/StockListScreen.kt
          grep -q 'NAVER_REPORTED_TRAILING_PER' scripts/collect_real_quant_v2.py
          grep -q 'provider_per' scripts/collect_real_quant_v2.py
          ! grep -q 'RegistrationRow("실적 PER", "1,677개 실데이터")' app/src/main/java/com/krstock/v3/ui/screens/HomeScreen.kt

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: KR4_PER_UI_Extreme_CleanPass
          path: |
            dist/KR4_PER_UI_Extreme_CleanPass_debug.apk
            evidence/ci/APK_SHA256.txt
            evidence/ci/APK_SIZE.txt
            evidence/combo_rank_stress_results.json
            evidence/real_quant_snapshot.json
            evidence/clean_pass_results.json
            evidence/stress_results.json
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14
