name: KR4 AutoUpdate Extreme CleanPass

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: kr4-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-device-matrix:
    name: Android14 UI ${{ matrix.device }} ${{ matrix.theme }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FINANCIAL_EVIDENCE_REF: ${{ github.head_ref || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {device: phone, profile: pixel_2, theme: light, night: 'no', font: '1.0'}
          - {device: phone, profile: pixel_2, theme: dark, night: 'yes', font: '1.3'}
          - {device: tablet, profile: pixel_c, theme: light, night: 'no', font: '1.0'}
          - {device: tablet, profile: pixel_c, theme: dark, night: 'yes', font: '1.3'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gallery provenance and original-file regression tests
        run: python3 -m unittest discover -s tests -p test_ui_gallery.py
      - name: Prepare Android14 UI runner
        env:
          UI_NIGHT: ${{ matrix.night }}
          UI_FONT: ${{ matrix.font }}
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          cat > "$RUNNER_TEMP/kr4-ui-matrix.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          adb shell cmd uimode night "$UI_NIGHT"
          adb shell settings put system font_scale "$UI_FONT"
          mkdir -p evidence/ui-device
          adb devices -l > evidence/ui-device/available-devices.txt
          adb shell getprop > evidence/ui-device/device-properties.txt
          gradle :app:connectedDebugAndroidTest --stacktrace \
            -Pandroid.testInstrumentationRunnerArguments.deviceKind=EMULATOR \
            "-Pandroid.testInstrumentationRunnerArguments.financialEvidenceRef=$FINANCIAL_EVIDENCE_REF" \
            -Pandroid.testInstrumentationRunnerArguments.class=com.krstock.v3.CompleteUiGalleryInstrumentedTest,com.krstock.v3.PriceChartTimeframeInstrumentedTest,com.krstock.v3.PriceChartAndRiskBadgeInstrumentedTest,com.krstock.v3.SnapshotLiveActivityInstrumentedTest,com.krstock.v3.PriceChartLiveInstrumentedTest,com.krstock.v3.SnapshotRefreshScreensInstrumentedTest,com.krstock.v3.FinancialSafetyLiveInstrumentedTest
          TEST_STATUS=$?
          adb logcat -d -v time > evidence/ui-device/logcat.txt
          adb pull /sdcard/Android/data/com.krstock.v3/files/snapshot-e2e evidence/ui-device/snapshot-e2e || true
          exit "$TEST_STATUS"
          SH
      - name: Run actual Android14 screen interactions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UI_NIGHT: ${{ matrix.night }}
          UI_FONT: ${{ matrix.font }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: kr4-ui-${{ matrix.device }}-${{ matrix.theme }}
          disable-animations: true
          script: bash "$RUNNER_TEMP/kr4-ui-matrix.sh"
      - name: Package original screenshots with explicit provenance
        if: success()
        run: |
          set -euo pipefail
          mkdir -p evidence/ui-input
          cp -a app/build/outputs/connected_android_test_additional_output evidence/ui-input/agp
          python3 scripts/build_ui_gallery.py evidence/ui-input evidence/ui-gallery
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('evidence/ui-gallery/manifest.json').read_text())
          screens=manifest['screens']
          assert all(s['api_level']==34 and s['device_kind']=='EMULATOR' for s in screens)
          assert all(s['viewport']=='${{ matrix.device }}'.upper() and s['theme']=='${{ matrix.theme }}'.upper() for s in screens)
          assert {s.get('metric_mask') for s in screens} >= set(range(1,16))
          assert {s.get('detail_tab') for s in screens} >= set(range(5))
          assert {s.get('scenario_source') for s in screens} >= {'LIVE','CACHE','BACKUP','BUNDLED','FAILED'}
          assert {s.get('safety_status') for s in screens} >= {'PASS','FAIL','HOLD','NOT_APPLICABLE'}
          combinations={(s.get('chart_interval'),s.get('chart_months'),s.get('chart_style')) for s in screens}
          assert combinations >= {(i,m,t) for i in ['DAY','WEEK','MONTH'] for m in [1,3,6,12] for t in ['LINE','CANDLE']}
          assert any(s['evidence_kind']=='REAL_MARKET_LIVE' for s in screens)
          assert any(s['name'].endswith('closed-and-relaunched-live') for s in screens)
          print('REQUIRED_ANDROID14_UI_CELL_PASS',len(screens))
          PY
      - name: Upload original UI gallery and device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KR4-UI-${{ matrix.device }}-${{ matrix.theme }}
          path: |
            evidence/ui-gallery/
            evidence/ui-device/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error
          retention-days: 30

  ui-gallery-required:
    name: Required Android14 galleries
    needs: ui-device-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: KR4-UI-*
          path: evidence/ui-matrix
      - name: Assemble all four original device galleries
        run: |
          set -euo pipefail
          mkdir -p evidence/ui-combined-input
          for CELL in phone-light phone-dark tablet-light tablet-dark; do
            test -s "evidence/ui-matrix/KR4-UI-$CELL/evidence/ui-gallery/manifest.json"
            cp -a "evidence/ui-matrix/KR4-UI-$CELL/evidence/ui-gallery/originals" "evidence/ui-combined-input/$CELL"
          done
          python3 scripts/build_ui_gallery.py evidence/ui-combined-input evidence/ui-complete-gallery
      - uses: actions/upload-artifact@v4
        with:
          name: KR4-UI-complete-gallery
          path: evidence/ui-complete-gallery/
          if-no-files-found: error
          retention-days: 30

  extreme-cleanpass:
    needs: ui-gallery-required
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_STABLE_CERT_SHA256: 1070e82beee574cd29ffd2dc3e693fd7f7862374f16d1606567db303ab152477
      FINANCIAL_EVIDENCE_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download required phone tablet light dark original gallery
        uses: actions/download-artifact@v4
        with:
          name: KR4-UI-complete-gallery
          path: evidence/ui-complete-gallery

      - name: Detect app source change
        id: app_scope
        run: |
          set -euo pipefail
          APP_CHANGED=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- app/ scripts/build_ui_gallery.py tests/test_ui_gallery.py .github/workflows/android-build.yml; then
            APP_CHANGED=false
          fi
          echo "changed=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "APP_SOURCE_CHANGED=$APP_CHANGED"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python collector dependency
        run: pip install requests pytest

      - name: Validate masters and current committed snapshot without frozen dates
        run: |
          set -euo pipefail
          test -s evidence/kospi_master_snapshot.json
          test -s evidence/kosdaq_master_snapshot.json
          test -s evidence/real_quant_snapshot.json
          test -s evidence/quarterly_history.json
          python3 - <<'PY'
          import json, math, re
          from datetime import date
          k = json.load(open('evidence/kospi_master_snapshot.json', encoding='utf-8'))
          q = json.load(open('evidence/kosdaq_master_snapshot.json', encoding='utf-8'))
          d = json.load(open('evidence/real_quant_snapshot.json', encoding='utf-8'))
          assert k['issuer_count'] + q['issuer_count'] == d['universe_count'] == len(d['records']) == 2649
          snap = date.fromisoformat(d['snapshot_date_kst'])
          price = date.fromisoformat(d['price_cutoff_date_kst'])
          assert price <= snap and (snap - price).days <= 10, (snap, price)
          c = d['coverage']
          floors = {'m01_available': 2400, 'm02_available': 2300, 'm03_available': 1600, 'm04_available': 2550, 'complete_count': 1380}
          for key, floor in floors.items():
              assert int(c[key]) >= floor, (key, c[key], floor)
          assert c['ranked_count'] == c['complete_count']
          ranks = []
          for code, row in d['records'].items():
              assert re.fullmatch(r'[0-9A-Z]{6}', code)
              metrics = [row[f'm0{i}'] for i in range(1, 5)]
              complete = True
              for metric in metrics:
                  if metric['raw'] is None:
                      complete = False
                      assert metric['percentile'] is None and metric['reason']
                  else:
                      assert math.isfinite(float(metric['raw']))
                      assert metric['percentile'] is not None and 0 <= float(metric['percentile']) <= 100
                      assert metric['basis']
              assert (row['composite'] is not None) == complete
              assert (row['rank'] is not None) == complete
              if row['rank'] is not None:
                  ranks.append(int(row['rank']))
          assert sorted(ranks) == list(range(1, len(ranks) + 1))
          assert d['records']['005930']['name'] == '삼성전자'
          print('CURRENT_SNAPSHOT_VALIDATED', snap, price, json.dumps(c, ensure_ascii=False))
          PY

      - name: Auto-update and quarterly-history adversarial logic tests
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 tests/test_auto_update_pipeline.py
          python3 tests/test_quarterly_history.py

      - name: Complete Python regression including independent financial provenance
        if: steps.app_scope.outputs.changed == 'true'
        run: python3 -m pytest -q tests

      - name: Live news/disclosure evidence source probe
        if: steps.app_scope.outputs.changed == 'true'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python3 scripts/probe_context_sources.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Python reference and combination Extreme simulations
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 tests/run_all.py evidence/clean_pass_results.json
          python3 tests/run_stress.py
          python3 tests/run_combo_rank_stress.py evidence/combo_rank_stress_results.json
          python3 - <<'PY'
          import json
          d = json.load(open('evidence/combo_rank_stress_results.json', encoding='utf-8'))
          assert d['status'] == 'PASS'
          assert d['all_nonempty_combinations_tested'] == 15
          assert d['ten_thousand_toggle_simulation_pass'] is True
          assert d['all_four_reproduces_committed_rank'] is True
          assert d['selected_complete_filter_checks'] == 2649 * 15
          print('COMBO_RANK_EXTREME_PASS', d['all_nonempty_combinations_tested'], d['selected_complete_filter_checks'])
          PY

      - name: Android 2649-stock regression tests
        if: steps.app_scope.outputs.changed == 'true'
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        if: steps.app_scope.outputs.changed == 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM for emulator
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          cat > "$RUNNER_TEMP/kr4-debug-e2e.sh" <<'SH'
          #!/usr/bin/env bash
          set +e
          gradle :app:connectedDebugAndroidTest --stacktrace \
            -Pandroid.testInstrumentationRunnerArguments.deviceKind=EMULATOR \
            "-Pandroid.testInstrumentationRunnerArguments.financialEvidenceRef=$FINANCIAL_EVIDENCE_REF"
          TEST_STATUS=$?
          mkdir -p evidence/ci
          adb pull /sdcard/Android/data/com.krstock.v3/files/snapshot-e2e evidence/ci/snapshot-e2e
          adb logcat -d -v time > evidence/ci/android-debug-logcat.txt
          exit "$TEST_STATUS"
          SH

      - name: Android 14 end-to-end simulation
        if: steps.app_scope.outputs.changed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$RUNNER_TEMP/kr4-debug-e2e.sh"

      - name: Hard verify APK and automatic-update fail-safes
        if: steps.app_scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist evidence/ci
          cp "$APK" dist/KR4_AUTOUPDATE_Extreme_CleanPass_debug.apk
          sha256sum "$APK" | tee evidence/ci/APK_SHA256.txt
          stat --printf='APK_BYTES=%s\n' "$APK" | tee evidence/ci/APK_SIZE.txt
          grep -q 'applicationId = "com.krstock.v3"' app/build.gradle.kts
          grep -q 'AppAutoUpdater.checkAndDownload' app/src/main/java/com/krstock/v3/MainActivity.kt
          grep -q 'PeriodicWorkRequestBuilder<AppUpdateWorker>' app/src/main/java/com/krstock/v3/KR4Application.kt
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'FileProvider' app/src/main/AndroidManifest.xml
          grep -q 'releases/latest/download/update.json' app/src/main/java/com/krstock/v3/update/AppAutoUpdater.kt
          grep -q 'signerDigests(installed) == signerDigests(archive)' app/src/main/java/com/krstock/v3/update/AppAutoUpdater.kt
          grep -q 'sha256(apk) != info.sha256' app/src/main/java/com/krstock/v3/update/AppAutoUpdater.kt
          grep -q 'id-token: write' .github/workflows/android-build.yml
          grep -q 'kr4-signing-vault-5yh3dd.v2.appdeploy.ai' .github/workflows/android-build.yml
          grep -q "$EXPECTED_STABLE_CERT_SHA256" .github/workflows/android-build.yml

      - name: Upload verified APK and evidence
        if: always() && steps.app_scope.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KR4_AUTOUPDATE_Extreme_CleanPass
          path: |
            dist/KR4_AUTOUPDATE_Extreme_CleanPass_debug.apk
            evidence/ci/APK_SHA256.txt
            evidence/ci/APK_SIZE.txt
            evidence/ci/snapshot-e2e/
            evidence/ci/android-debug-logcat.txt
            evidence/combo_rank_stress_results.json
            evidence/real_quant_snapshot.json
            evidence/quarterly_history.json
            evidence/clean_pass_results.json
            evidence/stress_results.json
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error
          retention-days: 14

      - name: Detect signed app-release eligibility
        id: release_gate
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          RELEASE_READY=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              RELEASE_READY=true
            elif git rev-parse HEAD^ >/dev/null 2>&1 && ! git diff --quiet HEAD^ HEAD -- app/ scripts/build_ui_gallery.py tests/test_ui_gallery.py .github/workflows/android-build.yml; then
              RELEASE_READY=true
            fi
          fi
          echo "app_changed=$RELEASE_READY" >> "$GITHUB_OUTPUT"
          echo "ready=$RELEASE_READY" >> "$GITHUB_OUTPUT"
          echo "RELEASE_READY=$RELEASE_READY"

      - name: Request GitHub OIDC token with toolkit
        if: steps.release_gate.outputs.ready == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const token = await core.getIDToken('kr4-signing-vault')
            if (!token || token.length < 100) throw new Error('OIDC token missing or too short')
            core.setSecret(token)
            const p = `${process.env.RUNNER_TEMP}/kr4-oidc-token.txt`
            fs.writeFileSync(p, token, { mode: 0o600 })
            core.info(`OIDC_TOOLKIT_PASS length=${token.length}`)

      - name: Prepare original KR4 stable signing identity
        if: steps.release_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test -s "$RUNNER_TEMP/kr4-oidc-token.txt"
          OIDC_TOKEN=$(cat "$RUNNER_TEMP/kr4-oidc-token.txt")
          test "${#OIDC_TOKEN}" -gt 100

          OIDC_TOKEN="$OIDC_TOKEN" python3 - <<'PYCLAIMS'
          import base64, json, os
          token=os.environ['OIDC_TOKEN']
          parts=token.split('.')
          assert len(parts)==3
          p=parts[1].replace('-','+').replace('_','/')
          p += '='*((4-len(p)%4)%4)
          claims=json.loads(base64.b64decode(p).decode('utf-8'))
          safe={k:claims.get(k) for k in ('iss','aud','sub','repository','repository_id','repository_owner','repository_owner_id','ref','event_name','workflow','workflow_ref','job_workflow_ref')}
          print('OIDC_SAFE_CLAIMS', json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PYCLAIMS

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/kr4-transport-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/kr4-transport-private.pem" \
            -pubout -outform DER -out "$RUNNER_TEMP/kr4-transport-public.der"
          TRANSPORT_KEY=$(base64 -w0 "$RUNNER_TEMP/kr4-transport-public.der" | tr '+/' '-_' | tr -d '=')

          RELAY_URL_FILE="$RUNNER_TEMP/kr4-relay-url.txt"
          OIDC_TOKEN="$OIDC_TOKEN" TRANSPORT_KEY="$TRANSPORT_KEY" RELAY_URL_FILE="$RELAY_URL_FILE" python3 - <<'PYURL'
          import os, urllib.parse
          fragment=urllib.parse.urlencode(
              {'relay_token':os.environ['OIDC_TOKEN'], 'transport_key':os.environ['TRANSPORT_KEY']},
              quote_via=urllib.parse.quote,
          )
          url='https://kr4-signing-vault-5yh3dd.v2.appdeploy.ai/#'+fragment
          with open(os.environ['RELAY_URL_FILE'],'w',encoding='utf-8') as f:
              f.write(url)
          os.chmod(os.environ['RELAY_URL_FILE'],0o600)
          print('SIGNING_BROWSER_RELAY_URL_READY')
          PYURL

          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          RELAY_URL=$(cat "$RELAY_URL_FILE")
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=15000 --dump-dom "$RELAY_URL" > "$RUNNER_TEMP/kr4-relay.html"
          rm -f "$RELAY_URL_FILE"

          RELAY_HTML="$RUNNER_TEMP/kr4-relay.html" RELAY_JSON="$RUNNER_TEMP/kr4-encrypted-signing.json" python3 - <<'PYRELAY'
          import html as html_lib, json, os, re
          src=open(os.environ['RELAY_HTML'],encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre[^>]*id=["\']relay-output["\'][^>]*>(.*?)</pre>',src,re.I|re.S)
          assert m, 'relay_output_missing'
          text=re.sub(r'<[^>]+>','',m.group(1))
          text=html_lib.unescape(text).strip()
          assert text and text != 'WORKING', 'relay_not_completed'
          doc=json.loads(text)
          assert not doc.get('error'), doc
          for key in ('algorithm','ciphertextChunks','repository','ref'):
              assert key in doc, (key, doc.keys())
          assert doc['algorithm']=='RSA-OAEP-SHA256'
          assert doc['repository']=='irewon1-lgtm/Kook'
          assert doc['ref']=='refs/heads/main'
          chunks=doc['ciphertextChunks']
          assert isinstance(chunks,list) and chunks and all(isinstance(x,str) and x for x in chunks)
          with open(os.environ['RELAY_JSON'],'w',encoding='utf-8') as f:
              json.dump(doc,f,separators=(',',':'))
              f.write('\n')
          print('SIGNING_BROWSER_RELAY_PASS', len(chunks))
          PYRELAY
          rm -f "$RUNNER_TEMP/kr4-relay.html"
          test -s "$RUNNER_TEMP/kr4-encrypted-signing.json"

          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'kr4-encrypted-signing.json')
          root = json.load(open(path, encoding='utf-8'))
          assert root.get('algorithm') == 'RSA-OAEP-SHA256'
          assert root.get('repository') == 'irewon1-lgtm/Kook'
          assert root.get('ref') == 'refs/heads/main'
          chunks = root.get('ciphertextChunks')
          assert isinstance(chunks, list) and chunks and all(isinstance(x, str) and x for x in chunks)
          out = os.path.join(os.environ['RUNNER_TEMP'], 'kr4-encrypted-chunks.txt')
          with open(out, 'w', encoding='utf-8') as f:
              for item in chunks:
                  f.write(item + '\n')
          PY

          : > "$RUNNER_TEMP/kr4-signing-bundle.txt"
          INDEX=0
          while IFS= read -r CHUNK; do
            printf '%s' "$CHUNK" | base64 -d > "$RUNNER_TEMP/kr4-chunk-${INDEX}.bin"
            openssl pkeyutl -decrypt \
              -inkey "$RUNNER_TEMP/kr4-transport-private.pem" \
              -in "$RUNNER_TEMP/kr4-chunk-${INDEX}.bin" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              >> "$RUNNER_TEMP/kr4-signing-bundle.txt"
            INDEX=$((INDEX + 1))
          done < "$RUNNER_TEMP/kr4-encrypted-chunks.txt"
          test "$INDEX" -gt 0

          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          rt=os.environ['RUNNER_TEMP']
          path=os.path.join(rt,'kr4-signing-bundle.txt')
          raw=open(path,encoding='utf-8').read().strip()
          assert len(raw)>100
          doc=json.loads(base64.b64decode(raw).decode('utf-8'))
          for key in ('keystore_b64','store_password','alias','key_password'):
              value=doc.get(key)
              assert isinstance(value,str) and value and '\n' not in value and '\r' not in value, key
          jks=os.path.join(rt,'kr4-release.jks')
          open(jks,'wb').write(base64.b64decode(doc['keystore_b64']))
          os.chmod(jks,0o600)
          cert=subprocess.check_output([
              'keytool','-exportcert','-keystore',jks,'-alias',doc['alias'],'-storepass',doc['store_password']
          ],stderr=subprocess.DEVNULL)
          sha=hashlib.sha256(cert).hexdigest()
          expected=os.environ['EXPECTED_STABLE_CERT_SHA256']
          assert sha==expected,(sha,expected)
          print(f"::add-mask::{doc['store_password']}")
          print(f"::add-mask::{doc['key_password']}")
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              out.write(f"KR4_KEYSTORE_FILE={jks}\n")
              out.write(f"KR4_KEYSTORE_PASSWORD={doc['store_password']}\n")
              out.write(f"KR4_KEY_ALIAS={doc['alias']}\n")
              out.write(f"KR4_KEY_PASSWORD={doc['key_password']}\n")
              out.write(f"KR4_SIGNING_CERT_SHA256={sha}\n")
          print('STABLE_SIGNING_CERT_PASS',sha)
          PY

          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          [[ "$LATEST_TAG" =~ ^kr4-app-c([0-9]+)$ ]]
          VERSION_CODE=$((10#${BASH_REMATCH[1]} + 1))
          while gh release view "kr4-app-c${VERSION_CODE}" >/dev/null 2>&1; do VERSION_CODE=$((VERSION_CODE + 1)); done
          VERSION_NAME="4.3.$((VERSION_CODE - 20000))"
          echo "KR4_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "KR4_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          rm -f \
            "$RUNNER_TEMP/kr4-oidc-token.txt" \
            "$RUNNER_TEMP/kr4-encrypted-signing.json" \
            "$RUNNER_TEMP/kr4-encrypted-chunks.txt" \
            "$RUNNER_TEMP/kr4-signing-bundle.txt" \
            "$RUNNER_TEMP/kr4-transport-private.pem" \
            "$RUNNER_TEMP/kr4-transport-public.der" \
            "$RUNNER_TEMP"/kr4-chunk-*.bin
          echo "STABLE_SIGNING_IDENTITY_READY cert_sha256=$EXPECTED_STABLE_CERT_SHA256 version=$VERSION_NAME latest=$LATEST_TAG"

      - name: Build and verify stable signed Release APK
        if: steps.release_gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/KR4.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs dist/KR4.apk | tee dist/APK_SIGNING_CERT.txt
          ACTUAL_APK_CERT_SHA=$(python3 - <<'PYAPK'
          import re
          text=open('dist/APK_SIGNING_CERT.txt',encoding='utf-8',errors='replace').read()
          m=re.search(r'(?im)certificate SHA-256 digest:\s*([0-9a-f:]{64,95})\s*$', text)
          assert m, 'apk_certificate_sha256_missing'
          print(m.group(1).replace(':','').lower())
          PYAPK
          )
          test "$ACTUAL_APK_CERT_SHA" = "$EXPECTED_STABLE_CERT_SHA256"
          BADGING=$("$AAPT" dump badging dist/KR4.apk | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.krstock.v3'"
          echo "$BADGING" | grep -q "versionCode='${KR4_VERSION_CODE}'"
          echo "$BADGING" | grep -q "versionName='${KR4_VERSION_NAME}'"
          echo "STABLE_RELEASE_APK_PASS bytes=$(stat -c%s dist/KR4.apk) cert=$ACTUAL_APK_CERT_SHA"

      - name: Preserve and verify official signed upgrade baseline
        if: steps.release_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/ci/upgrade/baseline
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > evidence/ci/upgrade/baseline-release.json
          BASELINE_TAG=$(python3 - <<'PY'
          import json, re
          release=json.load(open('evidence/ci/upgrade/baseline-release.json',encoding='utf-8'))
          assert not release['draft'] and not release['prerelease']
          assert re.fullmatch(r'kr4-app-c[0-9]+', release['tag_name'])
          print(release['tag_name'])
          PY
          )
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" \
            -p KR4.apk -p update.json -p APK_SIGNING_CERT.txt -D evidence/ci/upgrade/baseline
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          root=Path('evidence/ci/upgrade')
          release=json.loads((root/'baseline-release.json').read_text())
          manifest=json.loads((root/'baseline/update.json').read_text())
          apk=root/'baseline/KR4.apk'
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert sha==manifest['sha256'], 'baseline_checksum_mismatch'
          expected=os.environ['EXPECTED_STABLE_CERT_SHA256']
          assert manifest['signingCertificateSha256']==expected
          tools=sorted((Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'),key=lambda p:tuple(int(x) for x in p.parent.name.split('.') if x.isdigit()))[-1].parent
          certs=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
          (root/'baseline-verified-certificate.txt').write_text(certs)
          digests=re.findall(r'(?im)certificate SHA-256 digest:\s*([0-9a-f:]{64,95})\s*$',certs)
          assert len(digests)==1 and digests[0].replace(':','').lower()==expected, 'baseline_signer_mismatch'
          badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True).splitlines()[0]
          package=re.search(r"name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",badging)
          assert package and package[1]=='com.krstock.v3'
          version=int(package[2])
          assert version==manifest['versionCode']==int(release['tag_name'].removeprefix('kr4-app-c'))
          assert package[3]==manifest['versionName']
          assert version<int(os.environ['KR4_VERSION_CODE']), 'release_must_upgrade_official_latest'
          assets={a['name']:a for a in release['assets']}
          assert apk.stat().st_size==assets['KR4.apk']['size']
          proof={'tag':release['tag_name'],'versionCode':version,'versionName':package[3],
                 'sha256':sha,'signingCertificateSha256':expected,'packageName':package[1],
                 'apkUrl':assets['KR4.apk']['browser_download_url']}
          (root/'baseline-verification.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('OFFICIAL_SIGNED_BASELINE_PASS',json.dumps(proof))
          PY
          cat > "$RUNNER_TEMP/kr4-stable-upgrade.py" <<'PY'
          import hashlib, json, os, re, subprocess, time
          from pathlib import Path

          root=Path('evidence/ci/upgrade')
          baseline=json.loads((root/'baseline-verification.json').read_text())
          package='com.krstock.v3'
          component=package+'/.MainActivity'
          expected_version=int(os.environ['KR4_VERSION_CODE'])
          expected_cert=os.environ['EXPECTED_STABLE_CERT_SHA256']
          snapshot=json.loads(Path('evidence/real_quant_snapshot.json').read_text())

          def adb(*args):
              result=subprocess.run(['adb',*args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              with (root/'adb-install-upgrade.log').open('a') as log:
                  log.write('$ adb '+' '.join(args)+'\n'+result.stdout+'\n')
              assert result.returncode==0, result.stdout
              return result.stdout.strip()

          def installed():
              dump=adb('shell','dumpsys','package',package)
              return {'versionCode':int(re.search(r'\bversionCode=(\d+)',dump)[1]),
                      'uid':int(re.search(r'\b(?:appId|userId)=(\d+)',dump)[1]),
                      'firstInstallTime':re.search(r'firstInstallTime=([^\r\n]+)',dump)[1].strip()}

          # RELEASE_UI_HELPERS_BEGIN
          def ui_bounds(xml, label):
              import re
              import xml.etree.ElementTree as ET
              for node in ET.fromstring(xml).iter('node'):
                  if node.get('text') != label and node.get('content-desc') != label:
                      continue
                  if node.get('enabled') == 'false':
                      continue
                  coordinates = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.get('bounds', ''))
                  if not coordinates:
                      continue
                  left, top, right, bottom = map(int, coordinates.groups())
                  if right > left and bottom > top:
                      return ((left + right) // 2, (top + bottom) // 2)
              raise ValueError('Visible enabled exact UI control absent: ' + label)
          # RELEASE_UI_HELPERS_END

          def read_ui():
              adb('shell','uiautomator','dump','/sdcard/kr4-upgrade-ui.xml')
              return adb('shell','cat','/sdcard/kr4-upgrade-ui.xml')

          def touch(label, scroll=False, attempts=12, contains=False):
              for attempt in range(attempts):
                  xml=read_ui()
                  target=label
                  if contains:
                      import xml.etree.ElementTree as ET
                      target=next((n.get('text') for n in ET.fromstring(xml).iter('node') if label in n.get('text','')),label)
                  try:
                      x,y=ui_bounds(xml,target)
                  except ValueError:
                      if scroll:
                          dimensions=re.search(r'(\d+)x(\d+)',adb('shell','wm','size'))
                          width,height=map(int,dimensions.groups())
                          adb('shell','input','swipe',str(width//2),str(height*4//5),str(width//2),str(height//3),'350')
                      time.sleep(1)
                  else:
                      adb('shell','input','tap',str(x),str(y))
                      time.sleep(1)
                      return
              raise AssertionError('Installed release control unavailable: '+label)

          def touch_stock(code, name):
              import xml.etree.ElementTree as ET
              for attempt in range(12):
                  xml=read_ui()
                  for node in ET.fromstring(xml).iter('node'):
                      text=node.get('text','')
                      if code in text and name in text:
                          x,y=ui_bounds(xml,text)
                          adb('shell','input','tap',str(x),str(y))
                          time.sleep(1)
                          return
                  dimensions=re.search(r'(\d+)x(\d+)',adb('shell','wm','size'))
                  width,height=map(int,dimensions.groups())
                  adb('shell','input','swipe',str(width//2),str(height*4//5),str(width//2),str(height//3),'350')
              raise AssertionError('Searched stock is not reachable in installed release: '+code)

          def touch_safety():
              for attempt in range(12):
                  xml=read_ui()
                  for label in ['자료 확인','재무자료 확인','재무위험','미확보','비교제외']:
                      try:
                          x,y=ui_bounds(xml,label)
                      except ValueError:
                          continue
                      adb('shell','input','tap',str(x),str(y))
                      time.sleep(1)
                      return
                  dimensions=re.search(r'(\d+)x(\d+)',adb('shell','wm','size'))
                  width,height=map(int,dimensions.groups())
                  adb('shell','input','swipe',str(width//2),str(height*4//5),str(width//2),str(height//3),'350')
              raise AssertionError('No financial-safety badge on installed detail')

          def capture(name, xml, details=None):
              (root/(name+'.xml')).write_text(xml)
              with (root/(name+'.png')).open('wb') as image:
                  subprocess.run(['adb','exec-out','screencap','-p'],stdout=image,check=True)
              # UI interaction probes use real downloaded market data, but this
              # release gate controls system settings and install state explicitly.
              metadata={'evidence_kind':'CONTROLLED_FIXTURE','controlled_state':True,
                        'source':'LIVE' if '데이터 출처 LIVE' in xml else 'UNCONFIRMED',
                        'device_kind':'EMULATOR','api_level':34,'theme':'DARK','viewport':'PHONE',
                        'capture_method':'ADB_SCREENCAP_ORIGINAL_PNG','installed_release':True,
                        'package':package,'version_code':expected_version}
              metadata.update(details or {})
              (root/(name+'.json')).write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')

          def wait_for_baseline_live_cache():
              cache_path=f'/data/user/0/{package}/files/kr4_latest_snapshot.json'
              local_cache=root/'baseline-market-cache.json'
              deadline=time.monotonic()+120
              while True:
                  xml=read_ui()
                  if '데이터 출처 LIVE' in xml:
                      # Pull the original file; decoding adb text output would
                      # lose its exact original bytes and trailing whitespace.
                      adb('pull',cache_path,str(local_cache))
                      original=local_cache.read_bytes()
                      market=json.loads(original)
                      assert market['universe_count']==len(market['records'])==2649
                      count=f"{market['coverage']['complete_count']}/{market['universe_count']}"
                      if market['snapshot_date_kst'] in xml and count in xml:
                          digest=hashlib.sha256(original).hexdigest()
                          capture('baseline-live-home',xml,{
                              'evidence_kind':'REAL_MARKET_LIVE','controlled_state':False,
                              'source':'LIVE','network_succeeded':True,
                              'version_code':baseline['versionCode'],
                              'snapshot_date_kst':market['snapshot_date_kst'],
                              'price_cutoff_date_kst':market['price_cutoff_date_kst'],
                              'cache_path':cache_path,'cache_sha256':digest,
                              'source_provenance':{'cache_file':local_cache.name,'sha256':digest}})
                          return cache_path,original,market,digest
                  assert time.monotonic()<deadline, 'baseline_actual_live_market_cache_not_visible'
                  time.sleep(2)

          try:
              adb('root')
              adb('wait-for-device')
              assert 'uid=0(root)' in adb('shell','id'), 'root_required_for_private_data_preservation_check'
              assert 'Success' in adb('install','--no-streaming',str(root/'baseline/KR4.apk'))
              adb('shell','cmd','uimode','night','yes')
              night_before=adb('shell','settings','get','secure','ui_night_mode')
              assert night_before=='2', 'real_system_dark_theme_setting_not_applied'
              assert 'Status: ok' in adb('shell','am','start','-W','-n',component)
              cache_path,baseline_cache,baseline_market,baseline_cache_sha=wait_for_baseline_live_cache()
              adb('shell','am','force-stop',package)
              stopped_cache=root/'baseline-market-cache-before-upgrade.json'
              adb('pull',cache_path,str(stopped_cache))
              assert stopped_cache.read_bytes()==baseline_cache, 'baseline_market_cache_changed_before_upgrade'
              before=installed()
              assert before['versionCode']==baseline['versionCode']
              marker=f"kr4-upgrade-{os.environ['GITHUB_RUN_ID']}-{expected_version}"
              local_marker=root/'app-private-marker.txt'
              local_marker.write_text(marker)
              private_dir=f'/data/user/0/{package}/files'
              private_marker=private_dir+'/ci-upgrade-preserved.txt'
              adb('shell','mkdir','-p',private_dir)
              adb('push',str(local_marker),private_marker)
              adb('shell','chown',f"{before['uid']}:{before['uid']}",private_dir,private_marker)
              adb('shell','chmod','600',private_marker)
              adb('shell','restorecon',private_marker)
              assert 'Success' in adb('install','--no-streaming','-r','dist/KR4.apk')
              # Verify existing real market data before the new app can launch
              # or perform any network refresh that could replace the cache.
              upgraded_cache=root/'baseline-market-cache-after-upgrade-before-launch.json'
              adb('pull',cache_path,str(upgraded_cache))
              upgraded_cache_bytes=upgraded_cache.read_bytes()
              upgraded_cache_sha=hashlib.sha256(upgraded_cache_bytes).hexdigest()
              assert upgraded_cache_bytes==baseline_cache, 'actual_baseline_market_cache_bytes_not_preserved'
              assert upgraded_cache_sha==baseline_cache_sha, 'actual_baseline_market_cache_sha256_not_preserved'
              after=installed()
              assert after['versionCode']==expected_version>before['versionCode']
              assert before['uid']==after['uid'], 'app_uid_changed'
              assert before['firstInstallTime']==after['firstInstallTime'], 'app_was_reinstalled_instead_of_upgraded'
              assert adb('shell','cat',private_marker)==marker, 'app_private_data_not_preserved'
              assert adb('shell','settings','get','secure','ui_night_mode')==night_before, 'system_theme_setting_not_preserved'
              installed_path=adb('shell','pm','path',package).splitlines()[0].removeprefix('package:')
              installed_apk=root/'installed-KR4.apk'
              adb('pull',installed_path,str(installed_apk))
              installed_sha=hashlib.sha256(installed_apk.read_bytes()).hexdigest()
              assert installed_sha==hashlib.sha256(Path('dist/KR4.apk').read_bytes()).hexdigest()
              signers=sorted((Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'),key=lambda p:tuple(int(x) for x in p.parent.name.split('.') if x.isdigit()))
              certs=subprocess.check_output([str(signers[-1]),'verify','--verbose','--print-certs',str(installed_apk)],text=True)
              (root/'installed-certificate.txt').write_text(certs)
              digests=re.findall(r'(?im)certificate SHA-256 digest:\s*([0-9a-f:]{64,95})\s*$',certs)
              assert len(digests)==1 and digests[0].replace(':','').lower()==expected_cert
              adb('logcat','-c')
              assert 'Status: ok' in adb('shell','am','start','-W','-n',component)
              deadline=time.monotonic()+90
              while True:
                  adb('shell','uiautomator','dump','/sdcard/kr4-upgrade-ui.xml')
                  ui=adb('shell','cat','/sdcard/kr4-upgrade-ui.xml')
                  (root/'updated-home.xml').write_text(ui)
                  expected_count=f"{snapshot['coverage']['complete_count']}/{snapshot['universe_count']}"
                  if snapshot['snapshot_date_kst'] in ui and expected_count in ui:
                      break
                  assert time.monotonic()<deadline, 'updated_release_did_not_display_current_quant_snapshot'
                  time.sleep(2)
              assert adb('shell','pidof',package), 'updated_app_not_running'
              capture('updated-home',ui,{'displayed_snapshot_date':snapshot['snapshot_date_kst']})
              # Force-stop/relaunch the actual upgraded release, retaining theme,
              # UID, first installation identity, and application-private data.
              adb('shell','am','force-stop',package)
              assert 'Status: ok' in adb('shell','am','start','-W','-n',component)
              assert adb('shell','settings','get','secure','ui_night_mode')==night_before
              deadline=time.monotonic()+90
              while True:
                  ui=read_ui()
                  if snapshot['snapshot_date_kst'] in ui and expected_count in ui:
                      break
                  assert time.monotonic()<deadline, 'relaunch_did_not_restore_current_data'
                  time.sleep(2)
              capture('updated-relaunched-home',ui,{'setting_ui_night_mode':night_before})
              # All actions below are real accessibility-coordinate touches in the
              # installed signed release, without a debug-only navigation hook.
              touch('4지표 전체 종목보기',scroll=True,contains=True)
              ui=read_ui()
              assert '국내주식 조합순위' in ui
              capture('updated-all-stocks',ui,{'universe_count':2649})
              # Search the actual stock by code using the editable field bounds.
              import xml.etree.ElementTree as ET
              edit=next(n for n in ET.fromstring(ui).iter('node') if n.get('class')=='android.widget.EditText')
              x,y=ui_bounds(ET.tostring(edit,encoding='unicode'),edit.get('text') or edit.get('content-desc',''))
              adb('shell','input','tap',str(x),str(y))
              adb('shell','input','text','005930')
              adb('shell','input','keyevent','111')
              touch_stock('005930','삼성전자')
              ui=read_ui()
              assert '005930' in ui
              capture('updated-stock-detail',ui,{'issuer':'005930'})
              # Safety evidence must remain reachable even when its actual state
              # is HOLD; the status dialog exposes the recorded source/reason.
              touch_safety()
              safety_ui=read_ui()
              assert '닫기' in safety_ui, 'financial_safety_dialog_did_not_open'
              capture('updated-safety-details',safety_ui)
              financial=json.loads(Path('evidence/financial_safety_snapshot.json').read_text())
              financial=financial.get('financial_safety',financial)
              samsung=financial['records']['005930']
              currency=samsung.get('currency','')
              required_facts=[format(samsung[key],',')+('원' if currency=='KRW' else ' '+currency)
                              for key in ['assets','liabilities','equity','current_assets','current_liabilities']
                              if samsung.get(key) is not None]
              required_facts += [samsung[key] for key in ['report_period','filing_date','source_url'] if samsung.get(key)]
              observed=safety_ui
              for index in range(10):
                  if all(value in observed for value in required_facts):
                      break
                  dimensions=re.search(r'(\d+)x(\d+)',adb('shell','wm','size'))
                  width,height=map(int,dimensions.groups())
                  adb('shell','input','swipe',str(width//2),str(height*3//4),str(width//2),str(height//3),'350')
                  safety_ui=read_ui()
                  observed+='\n'+safety_ui
                  capture('updated-safety-facts-'+str(index),safety_ui,{'issuer':'005930','facts_verified':samsung.get('facts_verified',False)})
              assert all(value in observed for value in required_facts), 'installed_release_financial_facts_differ_from_published_artifact'
              touch('닫기')
              touch('차트')
              for interval,label in [('DAY','일봉'),('WEEK','주봉'),('MONTH','월봉')]:
                  dimensions=re.search(r'(\d+)x(\d+)',adb('shell','wm','size'))
                  width,height=map(int,dimensions.groups())
                  for _ in range(3):
                      adb('shell','input','swipe',str(width//2),str(height//3),str(width//2),str(height*4//5),'250')
                  touch(label,scroll=True)
                  ui=read_ui()
                  # Save the selected controls and visible original chart evidence.
                  assert '수정주가 미확인' in ui, 'adjustment_verification_warning_missing'
                  capture('updated-chart-'+interval+'-controls',ui,{'chart_interval':interval})
                  assert any(n.get('text')==label and (n.get('selected')=='true' or n.get('checked')=='true')
                             for n in ET.fromstring(ui).iter('node')), 'release_chart_interval_did_not_select'
                  deadline=time.monotonic()+90
                  while True:
                      ui=read_ui()
                      if all(value in ui for value in ['시가 ','종가 ','거래량 ']):
                          break
                      assert time.monotonic()<deadline, 'release_chart_actual_ohlcv_not_visible'
                      adb('shell','input','swipe',str(width//2),str(height*3//4),str(width//2),str(height//2),'250')
                      time.sleep(1)
                  capture('updated-chart-'+interval,ui,{'chart_interval':interval,'actual_ohlcv_visible':True})
              proof={'status':'PASS','baseline':baseline,'before':before,'after':after,
                     'dataMarkerPreserved':True,'installedApkSha256':installed_sha,
                     'existingMarketDataPreserved':{
                         'status':'PASS','source':'REAL_MARKET_LIVE','deviceCachePath':cache_path,
                         'beforeSha256':baseline_cache_sha,'afterUpgradeBeforeLaunchSha256':upgraded_cache_sha,
                         'exactOriginalBytesPreserved':True,'checkedBeforeUpgradedAppLaunch':True,
                         'bytes':len(baseline_cache),'universeCount':baseline_market['universe_count'],
                         'snapshotDate':baseline_market['snapshot_date_kst'],
                         'priceCutoffDate':baseline_market['price_cutoff_date_kst'],
                         'beforeFile':stopped_cache.name,'afterFile':upgraded_cache.name},
                     'signingCertificateSha256':expected_cert,
                     'displayedSnapshotDate':snapshot['snapshot_date_kst'],
                     'displayedCompleteAndUniverse':expected_count,'commit':os.environ['GITHUB_SHA'],
                     'settingPreserved':{'name':'ui_night_mode','value':night_before,'scope':'ANDROID_SYSTEM_THEME'},
                     'releaseSafetyComparedWithPublishedArtifact':True,'releaseSafetyFactsVerified':samsung.get('facts_verified',False),
                     'releaseRelaunchVerified':True,'releaseStockSafetyAndChartTouches':['005930','SAFETY','DAY','WEEK','MONTH']}
              (root/'signed-upgrade-verification.json').write_text(json.dumps(proof,indent=2)+'\n')
              print('STABLE_SIGNED_IN_PLACE_UPGRADE_PASS',json.dumps(proof))
          finally:
              result=subprocess.run(['adb','logcat','-d','-v','time'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              (root/'updated-app-logcat.txt').write_text(result.stdout)
          PY

      - name: Verify original signed APK upgrades in place on Android 14
        if: steps.release_gate.outputs.ready == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: kr4-stable-upgrade
          disable-animations: true
          script: python3 "$RUNNER_TEMP/kr4-stable-upgrade.py"

      - name: Upload signed upgrade install evidence
        if: always() && steps.release_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KR4_STABLE_SIGNED_UPGRADE_PROOF
          path: evidence/ci/upgrade/
          if-no-files-found: error
          retention-days: 14

      - name: Combine required device galleries with signed release screenshots
        if: steps.release_gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p evidence/ui-release-input
          cp -a evidence/ui-complete-gallery/originals evidence/ui-release-input/required-matrix
          cp -a evidence/ci/upgrade evidence/ui-release-input/signed-upgrade
          python3 scripts/build_ui_gallery.py evidence/ui-release-input dist/ui-gallery
          cp dist/ui-gallery/index.html dist/KR4-UI-gallery.html
          test -s dist/ui-gallery/KR4-UI-gallery.zip
          test -s dist/ui-gallery/manifest.json
          test -s dist/ui-gallery/SHA256SUMS.txt

      - name: Upload complete original release gallery
        if: steps.release_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KR4-UI-release-gallery
          path: |
            dist/ui-gallery/
            dist/KR4-UI-gallery.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload stable signed APK artifact
        if: steps.release_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KR4_STABLE_SIGNED_APK
          path: |
            dist/KR4.apk
            dist/APK_SIGNING_CERT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Generate cryptographic latest-update manifest
        if: steps.release_gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SHA256=$(sha256sum dist/KR4.apk | awk '{print $1}')
          export SHA256
          python3 - <<'PY'
          import json, os
          doc = {
              'versionCode': int(os.environ['KR4_VERSION_CODE']),
              'versionName': os.environ['KR4_VERSION_NAME'],
              'apkUrl': 'https://github.com/irewon1-lgtm/Kook/releases/latest/download/KR4.apk',
              'sha256': os.environ['SHA256'],
              'mandatory': False,
              'notes': '4지표 자동수신·화면 갱신 수정. Stage4 독립 검증과 HOLD, 실제 연결 상태 표시. 기존 고정서명 업데이트 설치 검증 완료.',
              'commit': os.environ['GITHUB_SHA'],
              'signingCertificateSha256': os.environ['KR4_SIGNING_CERT_SHA256'],
          }
          with open('dist/update.json', 'w', encoding='utf-8') as f:
              json.dump(doc, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps({k: v for k, v in doc.items() if k != 'apkUrl'}, ensure_ascii=False))
          PY
          grep -q '"sha256"' dist/update.json
          grep -q '"versionCode"' dist/update.json
          grep -q '"signingCertificateSha256"' dist/update.json

      - name: Publish immutable signed APK as GitHub latest release
        if: steps.release_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="kr4-app-c${KR4_VERSION_CODE}"
          TITLE="KR4 ${KR4_VERSION_NAME}"
          NOTES="4지표 자동수신·화면 갱신 수정. Stage4 독립 검증/HOLD 및 실제 연결 상태 표시. 기존 고정서명 APK 위 업데이트 설치와 데이터 보존 검증 완료. commit ${GITHUB_SHA}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KR4.apk dist/update.json dist/APK_SIGNING_CERT.txt \
              dist/KR4-UI-gallery.html dist/ui-gallery/KR4-UI-gallery.zip \
              dist/ui-gallery/manifest.json dist/ui-gallery/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" \
              dist/KR4.apk \
              dist/update.json \
              dist/APK_SIGNING_CERT.txt \
              dist/KR4-UI-gallery.html \
              dist/ui-gallery/KR4-UI-gallery.zip \
              dist/ui-gallery/manifest.json \
              dist/ui-gallery/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$TAG"
          rm -rf "$RUNNER_TEMP/kr4-release-verify"
          mkdir -p "$RUNNER_TEMP/kr4-release-verify"
          gh release download "$TAG" -p KR4.apk -p update.json -p APK_SIGNING_CERT.txt \
            -p KR4-UI-gallery.html -p KR4-UI-gallery.zip -p manifest.json -p SHA256SUMS.txt -D "$RUNNER_TEMP/kr4-release-verify"
          test "$(sha256sum dist/KR4.apk | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/kr4-release-verify/KR4.apk" | awk '{print $1}')"
          cmp -s dist/update.json "$RUNNER_TEMP/kr4-release-verify/update.json"
          cmp -s dist/KR4-UI-gallery.html "$RUNNER_TEMP/kr4-release-verify/KR4-UI-gallery.html"
          cmp -s dist/ui-gallery/KR4-UI-gallery.zip "$RUNNER_TEMP/kr4-release-verify/KR4-UI-gallery.zip"
          cmp -s dist/ui-gallery/manifest.json "$RUNNER_TEMP/kr4-release-verify/manifest.json"
          cmp -s dist/ui-gallery/SHA256SUMS.txt "$RUNNER_TEMP/kr4-release-verify/SHA256SUMS.txt"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'kr4-release-verify','update.json')
          d=json.load(open(p,encoding='utf-8'))
          assert d['commit']==os.environ['GITHUB_SHA']
          assert d['versionCode']==int(os.environ['KR4_VERSION_CODE'])
          assert d['versionName']==os.environ['KR4_VERSION_NAME']
          assert d['signingCertificateSha256']==os.environ['EXPECTED_STABLE_CERT_SHA256']
          print('LATEST_RELEASE_REDOWNLOAD_PASS', d['versionName'], d['versionCode'])
          PY
          gh release view "$TAG" --json tagName,name,url

      - name: Signed release status
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ "${{ steps.release_gate.outputs.app_changed }}" != "true" ]; then
            echo "No app/workflow code change: APK release intentionally skipped."
          else
            test -s dist/KR4.apk
            test -s dist/update.json
            echo "Stable signed APK release published and detectable by installed KR4 apps."
          fi
