name: KR4 Signing Vault Probe

on:
  push:
    branches:
      - fix/signing-vault-probe
    paths:
      - '.github/signing-vault-probe-trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit stage45 release trigger
        run: echo STAGE45_RELEASE_TRIGGER_OK
