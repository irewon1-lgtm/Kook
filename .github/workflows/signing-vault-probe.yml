name: KR4 Signing Vault Probe

on:
  push:
    branches:
      - fix/signing-vault-probe
    paths:
      - '.github/signing-vault-probe-trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discover AppDeploy frontend client transport from public bundle
        shell: bash
        env:
          VAULT_ORIGIN: https://kr4-signing-vault-5yh3dd.v2.appdeploy.ai
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.parse, urllib.request

          origin = 'https://kr4-signing-vault-5yh3dd.v2.appdeploy.ai'
          headers = {'User-Agent': 'Mozilla/5.0'}

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.headers.get('content-type',''), r.read()

          status, ctype, body = fetch(origin + '/')
          text = body.decode('utf-8', 'replace')
          print('INDEX', status, ctype, len(body))
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I)
          print('SCRIPT_COUNT', len(scripts))
          assert scripts, 'no_script_bundle_found'

          needles = [
              'api-v2.appdeploy.ai', 'proxy-v2.appdeploy.ai', '__appdeploy',
              'backend', 'lambda', '/api/', 'x-appdeploy', 'appdeploy.ai'
          ]
          found = set()
          urls = set()
          for src in scripts:
              url = urllib.parse.urljoin(origin + '/', src)
              s, ct, b = fetch(url)
              js = b.decode('utf-8', 'replace')
              print('SCRIPT', urllib.parse.urlparse(url).path, s, ct, len(b))
              for u in re.findall(r'https?://[^"\'`\\\s)]+', js):
                  if 'appdeploy' in u.lower():
                      urls.add(u[:300])
              lower = js.lower()
              for needle in needles:
                  pos = lower.find(needle.lower())
                  if pos >= 0:
                      snippet = js[max(0,pos-180):min(len(js),pos+360)]
                      snippet = re.sub(r'\s+', ' ', snippet)
                      found.add((needle, snippet[:600]))

          print('APPDEPLOY_URLS')
          for u in sorted(urls): print(u)
          print('TRANSPORT_SNIPPETS')
          for needle, snippet in sorted(found): print(needle, '=>', snippet)
          assert found or urls, 'no_transport_markers_found'
          PY
