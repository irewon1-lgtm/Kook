name: KR4 Signing Vault Probe

on:
  push:
    branches:
      - fix/signing-vault-probe
    paths:
      - '.github/signing-vault-probe-trigger'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe GitHub OIDC and signing vault without exposing secrets
        shell: bash
        env:
          SIGNING_VAULT_URL: https://kr4-signing-vault-5yh3dd.v2.appdeploy.ai/api/signing-material
        run: |
          set -euo pipefail
          umask 077
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          OIDC_STATUS=$(curl -sS -o "$RUNNER_TEMP/oidc.json" -w '%{http_code}' \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kr4-signing-vault")
          OIDC_BYTES=$(wc -c < "$RUNNER_TEMP/oidc.json")
          echo "OIDC_STATUS=$OIDC_STATUS OIDC_BYTES=$OIDC_BYTES"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'oidc.json')
          raw=open(p,'rb').read()
          assert raw, 'oidc_empty_body'
          doc=json.loads(raw)
          token=doc.get('value')
          assert isinstance(token,str) and len(token)>100, ('oidc_bad_shape', sorted(doc.keys()))
          print('OIDC_JSON_OK keys=',sorted(doc.keys()),'token_length=',len(token))
          open(os.path.join(os.environ['RUNNER_TEMP'],'oidc.token'),'w',encoding='utf-8').write(token)
          PY
          OIDC_TOKEN=$(cat "$RUNNER_TEMP/oidc.token")

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/transport-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/transport-private.pem" \
            -pubout -outform DER -out "$RUNNER_TEMP/transport-public.der"
          TRANSPORT_KEY=$(base64 -w0 "$RUNNER_TEMP/transport-public.der" | tr '+/' '-_' | tr -d '=')

          VAULT_STATUS=$(curl -sS --get -o "$RUNNER_TEMP/vault.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            --data-urlencode "transport_key=${TRANSPORT_KEY}" \
            "$SIGNING_VAULT_URL")
          VAULT_BYTES=$(wc -c < "$RUNNER_TEMP/vault.json")
          echo "VAULT_STATUS=$VAULT_STATUS VAULT_BYTES=$VAULT_BYTES"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'vault.json')
          raw=open(p,'rb').read()
          assert raw, 'vault_empty_body'
          doc=json.loads(raw)
          print('VAULT_JSON_KEYS', sorted(doc.keys()))
          if 'ciphertextChunks' in doc:
              chunks=doc['ciphertextChunks']
              assert isinstance(chunks,list) and chunks
              print('VAULT_JSON_OK algorithm=',doc.get('algorithm'),'repository=',doc.get('repository'),'ref=',doc.get('ref'),'chunk_count=',len(chunks))
          else:
              print('VAULT_ERROR_SHAPE error=',doc.get('error'),'message=',doc.get('message'))
              raise SystemExit(2)
          PY
