name: Refresh Real KOSDAQ Master

on:
  push:
    branches:
      - "register-real-kosdaq-master"
    paths:
      - "scripts/update_kosdaq_master.py"
      - ".github/workflows/kosdaq-master-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-kosdaq-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTML table parser
        run: |
          python -m pip install --upgrade pip
          pip install pandas lxml

      - name: Fetch official KOSDAQ listed-company master
        run: |
          set -euo pipefail
          python scripts/update_kosdaq_master.py \
            --output app/src/main/java/com/krstock/v3/data/generated/GeneratedKosdaqMaster.kt \
            --evidence evidence/kosdaq_master_snapshot.json
          grep -q 'const val issuerCount: Int = ' app/src/main/java/com/krstock/v3/data/generated/GeneratedKosdaqMaster.kt
          python - <<'PY'
          import json, re
          d=json.load(open('evidence/kosdaq_master_snapshot.json', encoding='utf-8'))
          assert d['market'] == 'KOSDAQ'
          assert 1200 <= d['issuer_count'] <= 2500
          assert d['issuer_count'] == d['unique_issue_codes']
          assert d['six_character_krx_codes'] is True
          print('KOSDAQ_MASTER_VALIDATED', d['issuer_count'], d['snapshot_date_kst'], 'alphanumeric', d['alphanumeric_issue_code_count'])
          PY

      - name: Commit refreshed master snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/krstock/v3/data/generated/GeneratedKosdaqMaster.kt evidence/kosdaq_master_snapshot.json; then
            echo "No KOSDAQ master change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/krstock/v3/data/generated/GeneratedKosdaqMaster.kt evidence/kosdaq_master_snapshot.json
          COUNT=$(python -c "import json; print(json.load(open('evidence/kosdaq_master_snapshot.json', encoding='utf-8'))['issuer_count'])")
          git commit -m "Register official KOSDAQ master (${COUNT} issuers)"
          git push origin HEAD:${{ github.ref_name }}
