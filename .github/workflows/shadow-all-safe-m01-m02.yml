name: KR4 All Safe M01 M02 Shadow

on:
  push:
    branches:
      - fix/standard-actual-recovery-clean-v1
    paths:
      - scripts/shadow_all_safe_m01_m02_recovery.py
      - .github/workflows/shadow-all-safe-m01-m02.yml

permissions:
  contents: write

concurrency:
  group: kr4-all-safe-m01-m02-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/standard-actual-recovery-clean-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pandas lxml
      - name: Run all-safe shadow
        working-directory: scripts
        run: python shadow_all_safe_m01_m02_recovery.py --quant ../evidence/real_quant_snapshot.json --out ../evidence/all_safe_m01_m02_shadow.json
      - name: Hard safety gates
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/all_safe_m01_m02_shadow.json',encoding='utf-8'))
          b=p['coverage_before']; a=p['coverage_after_shadow']
          assert b['m03_available']==a['m03_available']==2639
          assert b['m04_available']==a['m04_available']==2607
          assert a['m01_available']>=b['m01_available']
          assert a['m02_available']>=b['m02_available']
          assert a['complete_count']>=b['complete_count']
          print('ALL_SAFE_M01_M02_SHADOW_PASS',json.dumps({k:p[k] for k in ('candidate_issuer_count','m01_recovered','m02_recovered','coverage_before','coverage_after_shadow','source_error_count')},ensure_ascii=False))
          PY
      - name: Commit shadow evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/all_safe_m01_m02_shadow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record all-safe M01/M02 recovery shadow'
          git pull --rebase --autostash origin fix/standard-actual-recovery-clean-v1
          git push origin HEAD:fix/standard-actual-recovery-clean-v1
